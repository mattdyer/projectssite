<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kaleidoscope</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow-x: hidden;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
h1 {
  font-size: 1.6rem;
  padding: 12px 0 4px;
  background: linear-gradient(90deg, #ff6ec7, #7b68ee, #00ffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 14px;
  justify-content: center;
  align-items: center;
  max-width: 700px;
}
.control-group {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.06);
  padding: 5px 10px;
  border-radius: 8px;
}
.control-group label {
  font-size: 0.78rem;
  opacity: 0.85;
  white-space: nowrap;
}
select, button {
  background: rgba(255,255,255,0.1);
  color: #e0e0e0;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.2s;
}
select:hover, button:hover { background: rgba(255,255,255,0.2); }
input[type="color"] {
  width: 34px; height: 30px;
  border: none; border-radius: 6px;
  cursor: pointer;
  background: transparent;
  padding: 0;
}
input[type="range"] {
  width: 80px;
  accent-color: #7b68ee;
}
canvas {
  border-radius: 4px;
  cursor: crosshair;
  touch-action: none;
  max-width: 96vw;
  max-height: 70vh;
}
.color-palette {
  display: flex;
  gap: 4px;
}
.color-swatch {
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s, transform 0.15s;
}
.color-swatch:hover, .color-swatch.active {
  border-color: #fff;
  transform: scale(1.2);
}
label.toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.78rem;
  opacity: 0.85;
  cursor: pointer;
}
.toggle input { accent-color: #7b68ee; }
.hint {
  font-size: 0.72rem;
  opacity: 0.5;
  padding-bottom: 10px;
}
@media (max-width: 500px) {
  h1 { font-size: 1.2rem; }
  .controls { gap: 6px; padding: 6px 8px; }
  .control-group { padding: 4px 7px; }
  input[type="range"] { width: 60px; }
}
</style>
</head>
<body>

<h1>KALEIDOSCOPE</h1>

<div class="controls">
  <div class="control-group">
    <label>Symmetry:</label>
    <select id="segments">
      <option value="2">2</option>
      <option value="4">4</option>
      <option value="6" selected>6</option>
      <option value="8">8</option>
      <option value="10">10</option>
      <option value="12">12</option>
      <option value="16">16</option>
      <option value="20">20</option>
    </select>
  </div>
  <div class="control-group">
    <label>Brush:</label>
    <input type="range" id="brushSize" min="1" max="30" value="5">
    <span id="brushVal" style="font-size:0.75rem;min-width:20px;">5</span>
  </div>
  <div class="control-group">
    <label>Color:</label>
    <input type="color" id="colorPicker" value="#ff6ec7">
  </div>
  <div class="control-group">
    <label>BG:</label>
    <input type="color" id="bgColor" value="#0a0a1a">
  </div>
  <div class="control-group">
    <label class="toggle"><input type="checkbox" id="rainbowMode"> Rainbow</label>
  </div>
  <div class="control-group">
    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save</button>
  </div>
</div>

<div class="controls" style="margin-top:2px;">
  <div class="color-palette" id="palette"></div>
</div>

<canvas id="canvas"></canvas>
<p class="hint">Draw or drag on the canvas to create kaleidoscopic patterns</p>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const segmentsEl = document.getElementById('segments');
const brushSizeEl = document.getElementById('brushSize');
const brushValEl = document.getElementById('brushVal');
const colorPickerEl = document.getElementById('colorPicker');
const bgColorEl = document.getElementById('bgColor');
const rainbowModeEl = document.getElementById('rainbowMode');
const clearBtn = document.getElementById('clearBtn');
const saveBtn = document.getElementById('saveBtn');
const paletteEl = document.getElementById('palette');

const palette = [
  '#ff6ec7','#7b68ee','#00ffff','#ff4444','#44ff88',
  '#ffaa00','#ff69b4','#00ffaa','#ffdd00','#aa66ff',
  '#ff3366','#33ccff','#66ff33','#ff9933','#cc66ff'
];

let currentColor = '#ff6ec7';
let hueOffset = 0;
let drawing = false;
let lastX = null, lastY = null;

// Build palette swatches
palette.forEach((c, i) => {
  const swatch = document.createElement('div');
  swatch.className = 'color-swatch' + (i === 0 ? ' active' : '');
  swatch.style.background = c;
  swatch.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    currentColor = c;
    colorPickerEl.value = c;
    rainbowModeEl.checked = false;
  });
  paletteEl.appendChild(swatch);
});

// Resize canvas to fit viewport
function resize() {
  const maxW = Math.min(window.innerWidth * 0.96, 800);
  const maxH = window.innerHeight * 0.7;
  const size = Math.min(maxW, maxH, 700);
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  redrawBackground();
}

function redrawBackground() {
  ctx.fillStyle = bgColorEl.value;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

resize();
window.addEventListener('resize', resize);

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function drawStroke(x1, y1, x2, y2, color, size) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const segs = parseInt(segmentsEl.value);
  const halfAngle = Math.PI / segs;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = size;
  ctx.strokeStyle = color;

  for (let i = 0; i < segs; i++) {
    const angle = (Math.PI * 2 * i) / segs;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    // Original
    ctx.beginPath();
    ctx.moveTo(x1 - cx, y1 - cy);
    ctx.lineTo(x2 - cx, y2 - cy);
    ctx.stroke();

    // Mirror
    ctx.scale(-1, 1);
    ctx.beginPath();
    ctx.moveTo(x1 - cx, y1 - cy);
    ctx.lineTo(x2 - cx, y2 - cy);
    ctx.stroke();

    ctx.restore();
  }
}

function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const pos = getPos(e);
  lastX = pos.x;
  lastY = pos.y;
  // Draw a dot for single taps
  drawDot(pos.x, pos.y, lastX, lastY);
}

function drawDot(x, y, lx, ly) {
  drawStroke(lx, ly, x, y, currentColor, parseFloat(brushSizeEl.value));
}

function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  drawStroke(lastX, lastY, pos.x, pos.y, currentColor, parseFloat(brushSizeEl.value));
  lastX = pos.x;
  lastY = pos.y;
}

function endDraw(e) {
  if (e) e.preventDefault();
  drawing = false;
  lastX = null;
  lastY = null;
}

// Mouse events
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);

// Touch events
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', moveDraw, { passive: false });
canvas.addEventListener('touchend', endDraw, { passive: false });
canvas.addEventListener('touchcancel', endDraw, { passive: false });

// Controls
segmentsEl.addEventListener('change', redrawBackground);
brushSizeEl.addEventListener('input', () => {
  brushValEl.textContent = brushSizeEl.value;
});
colorPickerEl.addEventListener('input', (e) => {
  currentColor = e.target.value;
  rainbowModeEl.checked = false;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
});
bgColorEl.addEventListener('input', () => {
  redrawBackground();
});

clearBtn.addEventListener('click', () => {
  redrawBackground();
});

saveBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'kaleidoscope-art.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// Rainbow animation loop
let rainbowRAF;
function animateRainbow() {
  if (!rainbowModeEl.checked) return;
  hueOffset = (hueOffset + 0.5) % 360;
  currentColor = `hsl(${hueOffset}, 100%, 60%)`;
  colorPickerEl.value = `#${hueOffset >> 0}`; // approx
  requestAnimationFrame(animateRainbow);
}
canvas.addEventListener('mousedown', () => { if (rainbowModeEl.checked) requestAnimationFrame(animateRainbow); });
canvas.addEventListener('touchstart', () => { if (rainbowModeEl.checked) requestAnimationFrame(animateRainbow); });
</script>

</body>
</html>
