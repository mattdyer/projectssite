<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Arial', sans-serif;
  background: #faf8ef;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  touch-action: none;
  user-select: none;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 340px;
  margin-bottom: 16px;
}
.header h1 { font-size: 48px; color: #776e65; }
.scores { display: flex; gap: 8px; }
.score-box {
  background: #bbada0;
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  text-align: center;
  min-width: 70px;
}
.score-box .label { font-size: 11px; text-transform: uppercase; color: #eee4da; }
.score-box .value { font-size: 20px; font-weight: bold; }
.board-container {
  position: relative;
  background: #bbada0;
  border-radius: 8px;
  padding: 10px;
  width: 340px;
  height: 340px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
  height: 100%;
}
.cell {
  background: rgba(238, 228, 218, 0.35);
  border-radius: 6px;
}
.tile-layer {
  position: absolute;
  top: 10px; left: 10px; right: 10px; bottom: 10px;
}
.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  border-radius: 6px;
  transition: top 0.12s ease, left 0.12s ease;
}
.tile-new { animation: appear 0.2s ease; }
.tile-merged { animation: pop 0.2s ease; }
@keyframes appear {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.controls {
  margin-top: 16px;
  display: flex;
  gap: 8px;
}
.controls button {
  background: #8f7a66;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.controls button:hover { background: #7f6a56; }
.game-over-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(238, 228, 218, 0.73);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.game-over-overlay.active { opacity: 1; pointer-events: auto; }
.game-over-overlay h2 { font-size: 36px; color: #776e65; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="header">
  <h1>2048</h1>
  <div class="scores">
    <div class="score-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
</div>
<div class="board-container" id="board">
  <div class="grid" id="grid"></div>
  <div class="tile-layer" id="tileLayer"></div>
  <div class="game-over-overlay" id="overlay">
    <h2 id="overlayMsg">Game Over!</h2>
    <button onclick="game.restart()">Try Again</button>
  </div>
</div>
<div class="controls">
  <button onclick="game.restart()">New Game</button>
</div>
<script>
const CELL_SIZE = 75;
const GAP = 10;
const TILE_COLORS = {
  2:    {bg:'#eee4da', color:'#776e65', size:42},
  4:    {bg:'#ede0c8', color:'#776e65', size:42},
  8:    {bg:'#f2b179', color:'#f9f6f2', size:42},
  16:   {bg:'#f59563', color:'#f9f6f2', size:40},
  32:   {bg:'#f67c5f', color:'#f9f6f2', size:40},
  64:   {bg:'#f65e3b', color:'#f9f6f2', size:40},
  128:  {bg:'#edcf72', color:'#f9f6f2', size:34},
  256:  {bg:'#edcc61', color:'#f9f6f2', size:34},
  512:  {bg:'#edc850', color:'#f9f6f2', size:34},
  1024: {bg:'#edc53f', color:'#f9f6f2', size:28},
  2048: {bg:'#edc22e', color:'#f9f6f2', size:28},
};

function getTileStyle(val) {
  return TILE_COLORS[val] || {bg:'#3c3a32', color:'#f9f6f2', size:24};
}

class Game2048 {
  constructor() {
    this.grid = Array.from({length:4}, () => Array(4).fill(0));
    this.score = 0;
    this.best = parseInt(localStorage.getItem('2048best')) || 0;
    this.won = false;
    this.over = false;
    this.moving = false;
    this.tileId = 0;
    this.tiles = [];
    this.init();
  }

  init() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      gridEl.appendChild(cell);
    }
    document.getElementById('best').textContent = this.best;
    this.restart();
    this.bindKeys();
    this.bindTouch();
  }

  restart() {
    this.grid = Array.from({length:4}, () => Array(4).fill(0));
    this.score = 0;
    this.won = false;
    this.over = false;
    this.moving = false;
    this.tiles = [];
    this.tileId = 0;
    document.getElementById('score').textContent = '0';
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('tileLayer').innerHTML = '';
    this.spawn();
    this.spawn();
    this.render();
  }

  spawn() {
    const empty = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (this.grid[r][c] === 0) empty.push({r, c});
    if (empty.length === 0) return;
    const {r, c} = empty[Math.floor(Math.random() * empty.length)];
    const val = Math.random() < 0.9 ? 2 : 4;
    this.grid[r][c] = val;
    const tile = {id: ++this.tileId, r, c, val};
    this.tiles.push(tile);
  }

  bindKeys() {
    document.addEventListener('keydown', e => {
      if (this.moving) return;
      let dir = null;
      switch(e.key) {
        case 'ArrowUp': case 'w': case 'W': dir = 'up'; break;
        case 'ArrowDown': case 's': case 'S': dir = 'down'; break;
        case 'ArrowLeft': case 'a': case 'A': dir = 'left'; break;
        case 'ArrowRight': case 'd': case 'D': dir = 'right'; break;
      }
      if (dir) {
        e.preventDefault();
        this.move(dir);
      }
    });
  }

  bindTouch() {
    const board = document.getElementById('board');
    let startX, startY;
    board.addEventListener('touchstart', e => {
      if (this.moving) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive: true});
    board.addEventListener('touchend', e => {
      if (this.moving || startX == null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      const absDx = Math.abs(dx), absDy = Math.abs(dy);
      if (Math.max(absDx, absDy) < 20) return;
      let dir;
      if (absDx > absDy) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      this.move(dir);
      startX = startY = null;
    }, {passive: true});
  }

  move(dir) {
    this.moving = true;
    const rotated = this.rotateGrid(dir);
    let moved = false;
    let gained = 0;

    for (let r = 0; r < 4; r++) {
      // Slide: remove zeros, compact
      let row = [];
      for (let c = 0; c < 4; c++) {
        if (this.grid[r][c] !== 0) row.push(this.grid[r][c]);
      }
      // Merge adjacent equal tiles (toward direction)
      for (let c = 0; c < row.length - 1; c++) {
        if (row[c] === row[c + 1]) {
          row[c] *= 2;
          gained += row[c];
          row.splice(c + 1, 1);
        }
      }
      while (row.length < 4) row.push(0);
      for (let c = 0; c < 4; c++) {
        if (this.grid[r][c] !== row[c]) moved = true;
        this.grid[r][c] = row[c];
      }
    }

    this.rotateBack(dir);

    if (!moved) { this.moving = false; return; }

    this.score += gained;
    if (this.score > this.best) {
      this.best = this.score;
      localStorage.setItem('2048best', this.best);
    }
    document.getElementById('score').textContent = this.score;
    document.getElementById('best').textContent = this.best;

    if (!this.won) {
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++)
          if (this.grid[r][c] === 2048) this.won = true;
    }

    this.spawn();
    this.render();

    if (this.isGameOver()) {
      this.over = true;
      document.getElementById('overlayMsg').textContent = this.won ? 'You Win!' : 'Game Over!';
      document.getElementById('overlay').classList.add('active');
    }

    this.moving = false;
  }

  isGameOver() {
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        if (this.grid[r][c] === 0) return false;
        if (c < 3 && this.grid[r][c] === this.grid[r][c+1]) return false;
        if (r < 3 && this.grid[r][c] === this.grid[r+1][c]) return false;
      }
    return true;
  }

  rotateGrid(dir) {
    if (dir === 'left') return;
    let times;
    switch(dir) {
      case 'up': times = 3; break;
      case 'right': times = 2; break;
      case 'down': times = 1; break;
    }
    for (let t = 0; t < times; t++) this.rotateCW();
  }

  rotateBack(dir) {
    if (dir === 'left') return;
    let times;
    switch(dir) {
      case 'up': times = 1; break;
      case 'right': times = 2; break;
      case 'down': times = 3; break;
    }
    for (let t = 0; t < times; t++) this.rotateCW();
  }

  rotateCW() {
    const g = this.grid;
    const ng = Array.from({length:4}, () => Array(4).fill(0));
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        ng[c][3 - r] = g[r][c];
    this.grid = ng;
  }

  render() {
    const layer = document.getElementById('tileLayer');
    layer.innerHTML = '';
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const val = this.grid[r][c];
        if (val === 0) continue;
        const style = getTileStyle(val);
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = val;
        tile.style.width = CELL_SIZE + 'px';
        tile.style.height = CELL_SIZE + 'px';
        tile.style.top = (r * (CELL_SIZE + GAP)) + 'px';
        tile.style.left = (c * (CELL_SIZE + GAP)) + 'px';
        tile.style.fontSize = style.size + 'px';
        tile.style.backgroundColor = style.bg;
        tile.style.color = style.color;
        layer.appendChild(tile);
      }
    }
  }
}

const game = new Game2048();
</script>
</body>
</html>
