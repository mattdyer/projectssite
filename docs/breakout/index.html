<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout / Arkanoid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  h1 { margin-bottom: 10px; font-size: 1.8rem; color: #e94560; text-shadow: 0 0 10px #e9456088; }
  #hud { display: flex; gap: 30px; margin-bottom: 8px; font-size: 1rem; }
  #hud span { color: #0f3460; background: #eee; padding: 2px 12px; border-radius: 4px; font-weight: bold; }
  #gameCanvas {
    border: 2px solid #e94560; border-radius: 4px; cursor: none;
    background: #16213e;
  }
  #overlay {
    position: absolute; display: flex; flex-direction: column; align-items: center;
    justify-content: center; pointer-events: none; z-index: 10;
  }
  #overlay.active { pointer-events: auto; }
  #startScreen, #gameOverScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(26, 26, 46, 0.92); padding: 40px 50px; border-radius: 12px;
    border: 2px solid #e94560; text-align: center;
  }
  #startScreen h2, #gameOverScreen h2 { font-size: 2rem; margin-bottom: 10px; color: #e94560; }
  #startScreen p, #gameOverScreen p { margin-bottom: 20px; font-size: 1.1rem; }
  #finalScore { font-size: 1.5rem; color: #0f3460; background: #eee; padding: 4px 16px;
    border-radius: 6px; display: inline-block; margin-bottom: 15px; }
  button {
    padding: 14px 40px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px;
    cursor: pointer; transition: all 0.15s ease; background: #e94560; color: #fff;
    text-transform: uppercase; letter-spacing: 1px;
  }
  button:hover { background: #c73652; transform: scale(1.05); }
  button:active { transform: scale(0.97); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>BREAKOUT / ARKANOID</h1>
<div id="hud">
  <span id="scoreLabel">Score: 0</span>
  <span id="levelLabel">Level: 1</span>
  <span id="livesLabel">Lives: 3</span>
</div>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<div id="overlay" class="active">
  <div id="startScreen">
    <h2>BREAKOUT</h2>
    <p>Move paddle with mouse, touch, or arrow keys.<br>Break all bricks to advance.</p>
    <button id="playBtn">Play</button>
  </div>
  <div id="gameOverScreen" class="hidden">
    <h2>GAME OVER</h2>
    <div id="finalScore">0</div>
    <button id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// UI elements
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('playBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const scoreLabel = document.getElementById('scoreLabel');
const levelLabel = document.getElementById('levelLabel');
const livesLabel = document.getElementById('livesLabel');
const finalScore = document.getElementById('finalScore');

// Game state
let score, level, lives, gameOver;
let paddle, ball, bricks, particles;
let animId, running;

const PADDLE_W = 120, PADDLE_H = 14, PADDLE_Y = H - 30;
const PADDLE_SPEED = 6;
const BALL_R = 8;
const BRICK_ROWS = 5, BRICK_COLS = 10;
const BRICK_W = 70, BRICK_H = 22, BRICK_PAD = 4;
const BRICK_OFFSET_X = (W - BRICK_COLS * (BRICK_W + BRICK_PAD) + BRICK_PAD) / 2;
const BRICK_OFFSET_Y = 40;

const BRICK_COLORS = ['#e94560','#f5a623','#f7dc6f','#58d68d','#5dade2'];

function initGame() {
  score = 0; level = 1; lives = 3; gameOver = false;
  particles = [];
  resetBall();
  createBricks();
  updateHUD();
}

function resetBall() {
  paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H, speed: PADDLE_SPEED };
  ball = { x: W / 2, y: PADDLE_Y - BALL_R - 2, r: BALL_R, dx: 0, dy: 0, stuck: true };
}

function createBricks() {
  bricks = [];
  const durability = 1;
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      bricks.push({
        x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_PAD),
        y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_PAD),
        w: BRICK_W, h: BRICK_H,
        color: BRICK_COLORS[r % BRICK_COLORS.length],
        hits: durability,
        maxHits: durability,
        alive: true
      });
    }
  }
}

function updateHUD() {
  scoreLabel.textContent = 'Score: ' + score;
  levelLabel.textContent = 'Level: ' + level;
  livesLabel.textContent = 'Lives: ' + lives;
}

function launchBall() {
  if (!ball.stuck) return;
  ball.stuck = false;
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  const speed = 3.2 + level * 0.2;
  ball.dx = Math.cos(angle) * speed;
  ball.dy = Math.sin(angle) * speed;
  if (ball.dy > 0) ball.dy *= -1;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed,
      life: 1, decay: 0.02 + Math.random() * 0.03,
      color, size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx; p.y += p.dy;
    p.dy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function update() {
  if (gameOver) return;

  if (ball.stuck) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r;
    return;
  }

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.x - ball.r <= 0 || ball.x + ball.r >= W) { ball.dx *= -1; ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); }
  if (ball.y - ball.r <= 0) { ball.dy *= -1; ball.y = ball.r; }
  if (ball.y + ball.r >= H) {
    lives--;
    updateHUD();
    if (lives <= 0) { gameOver = true; showGameOver(); return; }
    resetBall();
    updateHUD();
    return;
  }

  if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 4
      && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
    const hitPos = (ball.x - paddle.x) / paddle.w;
    const angle = -Math.PI / 2 + (hitPos - 0.5) * 1.2;
    const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
    ball.dx = Math.cos(angle) * speed;
    ball.dy = Math.sin(angle) * speed;
    ball.y = paddle.y - ball.r;
    spawnParticles(ball.x, ball.y, '#eee', 5);
  }

  let allDestroyed = true;
  for (let b of bricks) {
    if (!b.alive) continue;
    allDestroyed = false;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w
        && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      const overlapLeft = ball.x + ball.r - b.x;
      const overlapRight = b.x + b.w - (ball.x - ball.r);
      const overlapTop = ball.y + ball.r - b.y;
      const overlapBottom = b.y + b.h - (ball.y - ball.r);
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

      if (minOverlap === overlapLeft || minOverlap === overlapRight) ball.dx *= -1;
      else ball.dy *= -1;

      b.hits--;
      if (b.hits <= 0) {
        b.alive = false;
        score += 10 * level;
        spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color, 15);
      } else {
        score += 5;
        spawnParticles(b.x + b.w/2, b.y + b.h/2, '#fff', 5);
      }
      updateHUD();
      break;
    }
  }

  if (allDestroyed) {
    level++;
    createBricks();
    resetBall();
    updateHUD();
  }

  updateParticles();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(b.x, b.y, b.w, b.h/3);
    if (b.maxHits > 1 && b.hits < b.maxHits) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.hits, b.x + b.w/2, b.y + b.h/2 + 4);
    }
  });

  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 10;
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  drawParticles();
}

function gameLoop() {
  update();
  draw();
  if (!gameOver) animId = requestAnimationFrame(gameLoop);
}

function showGameOver() {
  cancelAnimationFrame(animId);
  running = false;
  finalScore.textContent = score;
  startScreen.classList.add('hidden');
  gameOverScreen.classList.remove('hidden');
}

function startGame() {
  initGame();
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  running = true;
  animId = requestAnimationFrame(gameLoop);
}

// Input
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  paddle.x = (e.clientX - rect.left) * scaleX - paddle.w / 2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  if (ball.stuck) ball.x = paddle.x + paddle.w / 2;
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const touch = e.touches[0];
  paddle.x = (touch.clientX - rect.left) * scaleX - paddle.w / 2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  if (ball.stuck) ball.x = paddle.x + paddle.w / 2;
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') paddle.x -= PADDLE_SPEED;
  if (e.key === 'ArrowRight' || e.key === 'd') paddle.x += PADDLE_SPEED;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  if (ball.stuck) ball.x = paddle.x + paddle.w / 2;
  if (e.key === ' ' && ball.stuck) launchBall();
});

canvas.addEventListener('click', () => { if (ball.stuck) launchBall(); });
canvas.addEventListener('touchstart', () => { if (ball.stuck) launchBall(); });

// Button handlers - key fix: hide parent containers completely
playBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  startScreen.classList.add('hidden');
  startScreen.style.display = 'none';
  startGame();
});

playAgainBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  gameOverScreen.classList.add('hidden');
  gameOverScreen.style.display = 'none';
  startGame();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!startScreen.classList.contains('hidden')) playBtn.click();
    else if (!gameOverScreen.classList.contains('hidden')) playAgainBtn.click();
  }
});
</script>
</body>
</html>
