<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Breakout — Arkanoid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #e0e0e0;
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 640px;
    padding: 8px 12px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  #hud span { text-shadow: 0 0 8px rgba(0,180,255,0.5); }
  .hud-score { color: #00e5ff; }
  .hud-level { color: #ffab00; }
  .hud-lives { color: #ff3d71; }
  canvas {
    background: #10102a;
    border: 2px solid #1a3a5c;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(0,100,200,0.25);
    display: block;
    max-width: 100%;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }
  #overlay.active { pointer-events: auto; }
  #overlay h1 {
    font-size: 42px;
    color: #00e5ff;
    text-shadow: 0 0 20px #0077ff;
    margin-bottom: 12px;
  }
  #overlay p {
    font-size: 18px;
    color: #aaa;
    margin-bottom: 20px;
  }
  #overlay button {
    background: linear-gradient(135deg, #00b0ff, #0077ff);
    color: #fff;
    border: none;
    padding: 14px 40px;
    font-size: 20px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(0,100,255,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #overlay button:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 30px rgba(0,100,255,0.6);
  }
  #overlay button:active { transform: scale(0.97); }
  #overlay .sub {
    font-size: 14px;
    color: #666;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div id="hud">
  <span class="hud-score">SCORE: <span id="score">0</span></span>
  <span class="hud-level">LEVEL <span id="level">1</span></span>
  <span class="hud-lives">♥ <span id="lives">3</span></span>
</div>
<canvas id="game" width="640" height="480"></canvas>
<div id="overlay" class="active">
  <h1 id="overlay-title">BREAKOUT</h1>
  <p id="overlay-msg">Destroy all bricks to advance!</p>
  <button id="start-btn">PLAY</button>
  <p class="sub">Mouse, touch, or arrow keys to move</p>
</div>
<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // UI elements
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');

  // Game constants
  const PADDLE_W = 90, PADDLE_H = 14, PADDLE_Y = H - 36;
  const BALL_R = 7;
  const BRICK_ROWS = 5, BRICK_COLS = 8;
  const BRICK_W = 68, BRICK_H = 22, BRICK_PAD = 6, BRICK_TOP = 50;
  const BRICK_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;
  const COLORS = ['#ff3d71','#ffab00','#00e5ff','#76ff03','#d500f9'];

  // State
  let paddleX, ballX, ballY, vx, vy;
  let score, lives, level;
  let bricks = [];
  let running = false;
  let animId = null;
  let keys = { left: false, right: false };
  let particles = [];

  function initBricks() {
    bricks = [];
    for (let r = 0; r < BRICK_ROWS; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: BRICK_LEFT + c * (BRICK_W + BRICK_PAD),
          y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
          alive: true,
          color: COLORS[r % COLORS.length],
          hits: level <= 2 ? 1 : (level <= 4 ? 2 : 3)
        });
      }
    }
  }

  function resetBall() {
    ballX = paddleX + PADDLE_W / 2;
    ballY = PADDLE_Y - BALL_R - 2;
    const speed = 4 + level * 0.5;
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
    vx = Math.cos(angle) * speed;
    vy = Math.sin(angle) * speed;
  }

  function startGame() {
    level = 1;
    score = 0;
    lives = 3;
    paddleX = W / 2 - PADDLE_W / 2;
    particles = [];
    initBricks();
    resetBall();
    updateHUD();
    overlay.classList.remove('active');
    running = true;
    if (animId) cancelAnimationFrame(animId);
    loop();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = lives;
  }

  // Particles
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.03,
        size: 2 + Math.random() * 3,
        color
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  // Input
  function movePaddle(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const px = (clientX - rect.left) * scaleX - PADDLE_W / 2;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, px));
  }

  canvas.addEventListener('mousemove', e => { if (running) movePaddle(e.clientX); });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (running && e.touches.length) movePaddle(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchstart', e => {
    if (running && e.touches.length) movePaddle(e.touches[0].clientX);
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  startBtn.addEventListener('click', () => {
    if (!running) startGame();
  });

  function showOverlay(title, msg) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.classList.add('active');
  }

  // Physics
  function update() {
    // Keyboard paddle
    if (keys.left) paddleX -= 7;
    if (keys.right) paddleX += 7;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    // Move ball
    ballX += vx;
    ballY += vy;

    // Wall bounces
    if (ballX - BALL_R <= 0) { ballX = BALL_R; vx = Math.abs(vx); }
    if (ballX + BALL_R >= W) { ballX = W - BALL_R; vx = -Math.abs(vx); }
    if (ballY - BALL_R <= 0) { ballY = BALL_R; vy = Math.abs(vy); }

    // Bottom - lose life
    if (ballY + BALL_R >= H) {
      lives--;
      updateHUD();
      if (lives <= 0) {
        running = false;
        showOverlay('GAME OVER', `Score: ${score}`);
        return;
      }
      resetBall();
      return;
    }

    // Paddle collision
    if (vy > 0 &&
        ballY + BALL_R >= PADDLE_Y && ballY + BALL_R <= PADDLE_Y + PADDLE_H + 4 &&
        ballX >= paddleX - BALL_R && ballX <= paddleX + PADDLE_W + BALL_R) {
      const hit = (ballX - paddleX) / PADDLE_W; // 0..1
      const angle = -Math.PI * 0.8 + hit * Math.PI * 0.6;
      const speed = Math.sqrt(vx*vx + vy*vy);
      vx = Math.cos(angle) * speed;
      vy = Math.sin(angle) * speed;
      ballY = PADDLE_Y - BALL_R - 1;
      spawnParticles(ballX, ballY, '#00e5ff', 6);
    }

    // Brick collision
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ballX + BALL_R > b.x && ballX - BALL_R < b.x + BRICK_W &&
          ballY + BALL_R > b.y && ballY - BALL_R < b.y + BRICK_H) {
        b.hits--;
        if (b.hits <= 0) {
          b.alive = false;
          score += 10 * level;
          spawnParticles(b.x + BRICK_W/2, b.y + BRICK_H/2, b.color, 12);
        } else {
          spawnParticles(ballX, ballY, '#ffffff', 4);
        }
        updateHUD();

        // Determine bounce direction
        const overlapL = ballX + BALL_R - b.x;
        const overlapR = b.x + BRICK_W - (ballX - BALL_R);
        const overlapT = ballY + BALL_R - b.y;
        const overlapB = b.y + BRICK_H - (ballY - BALL_R);
        const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
        if (minOverlap === overlapT || minOverlap === overlapB) vy = -vy;
        else vx = -vx;
        break;
      }
    }

    // All bricks destroyed
    if (bricks.every(b => !b.alive)) {
      level++;
      updateHUD();
      initBricks();
      resetBall();
    }

    updateParticles();
  }

  // Draw
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Draw bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      const r = 4;
      ctx.roundRect(b.x, b.y, BRICK_W, BRICK_H, r);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Hit indicator
      if (b.hits > 1) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.hits, b.x + BRICK_W/2, b.y + BRICK_H/2);
      }
    }

    // Draw paddle
    const grad = ctx.createLinearGradient(paddleX, PADDLE_Y, paddleX, PADDLE_Y + PADDLE_H);
    grad.addColorStop(0, '#00e5ff');
    grad.addColorStop(1, '#0077ff');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw ball
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw particles
    drawParticles();
  }

  function loop() {
    if (!running) return;
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  // Initial draw
  ctx.fillStyle = '#1a1a3a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#333';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Press PLAY to start', W/2, H/2);

})();
</script>
</body>
</html>
