<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simon Says</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  color: #eee;
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

h1 {
  font-size: 2rem;
  margin-bottom: 0.25rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.subtitle {
  font-size: 0.9rem;
  color: #888;
  margin-bottom: 1rem;
}

#score-display {
  font-size: 1.3rem;
  margin-bottom: 0.75rem;
  height: 1.5em;
}

#message {
  font-size: 1rem;
  color: #ffd700;
  min-height: 1.5em;
  margin-bottom: 0.5rem;
  text-align: center;
}

#board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 8px;
  width: min(80vw, 320px);
  height: min(80vw, 320px);
  border-radius: 50%;
  overflow: hidden;
  padding: 8px;
  background: #16213e;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

.button {
  border: none;
  cursor: pointer;
  opacity: 0.6;
  transition: opacity 0.1s, transform 0.1s;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.button.active {
  opacity: 1;
  transform: scale(0.97);
}
#btn-green { background: #00c853; border-radius: 80% 10% 10% 10%; }
#btn-red   { background: #ff1744; border-radius: 10% 80% 10% 10%; }
#btn-yellow { background: #ffd600; border-radius: 10% 10% 80% 10%; }
#btn-blue  { background: #2979ff; border-radius: 10% 10% 10% 80%; }
#btn-green.active { filter: brightness(1.8); }
#btn-red.active   { filter: brightness(1.8); }
#btn-yellow.active { filter: brightness(1.8); }
#btn-blue.active  { filter: brightness(1.8); }

#start-btn {
  margin-top: 1rem;
  padding: 0.75rem 2.5rem;
  font-size: 1.1rem;
  border: 2px solid #ffd700;
  background: transparent;
  color: #ffd700;
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: background 0.2s, color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
#start-btn:hover { background: #ffd700; color: #1a1a2e; }

#high-score {
  margin-top: 0.75rem;
  font-size: 0.85rem;
  color: #666;
}
</style>
</head>
<body>

<h1>Simon Says</h1>
<p class="subtitle">Watch the sequence. Repeat it back.</p>
<div id="score-display"></div>
<div id="message">Press Start to begin</div>

<div id="board">
  <button class="button" id="btn-green" data-index="0"></button>
  <button class="button" id="btn-red" data-index="1"></button>
  <button class="button" id="btn-yellow" data-index="2"></button>
  <button class="button" id="btn-blue" data-index="3"></button>
</div>

<button id="start-btn">Start Game</button>
<div id="high-score">Best: 0</div>

<script>
(function() {
  const COLORS = ['green', 'red', 'yellow', 'blue'];
  const SOUNDS = [440, 554, 659, 880]; // A4, C#5, E5, A5
  let sequence = [];
  let playerIndex = 0;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('simonHighScore')) || 0;
  let playing = false;
  let showing = false;
  let audioCtx = null;

  const board = document.getElementById('board');
  const scoreDisplay = document.getElementById('score-display');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('start-btn');
  const highScoreEl = document.getElementById('high-score');

  highScoreEl.textContent = 'Best: ' + highScore;

  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(idx, dur) {
    dur = dur || 0.3;
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = SOUNDS[idx];
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  }

  function flashButton(idx, duration) {
    return new Promise(resolve => {
      const btn = document.getElementById('btn-' + COLORS[idx]);
      btn.classList.add('active');
      playTone(idx, duration / 1000 || 0.3);
      setTimeout(() => {
        btn.classList.remove('active');
        setTimeout(resolve, 80);
      }, duration || 400);
    });
  }

  async function showSequence() {
    showing = true;
    message.textContent = 'Watch...';
    const speed = Math.max(200, 500 - score * 15);

    for (let i = 0; i < sequence.length; i++) {
      await flashButton(sequence[i], speed);
    }
    showing = false;
    playerIndex = 0;
    message.textContent = 'Your turn!';
    scoreDisplay.textContent = 'Level: ' + score;
  }

  function nextRound() {
    sequence.push(Math.floor(Math.random() * 4));
    score++;
    showSequence();
  }

  async function playRound() {
    playing = true;
    sequence = [];
    score = 0;
    scoreDisplay.textContent = '';
    startBtn.style.display = 'none';
    nextRound();
  }

  async function playerPress(idx) {
    if (!playing || showing) return;

    await flashButton(idx, 200);

    if (sequence[playerIndex] !== idx) {
      // Wrong!
      playing = false;
      message.textContent = 'Game Over! Score: ' + score;
      scoreDisplay.textContent = '';

      // Error buzz
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 100;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch(e) {}

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('simonHighScore', highScore);
        highScoreEl.textContent = 'Best: ' + highScore;
        message.textContent = 'New Record! Score: ' + score;
      }

      startBtn.textContent = 'Play Again';
      startBtn.style.display = 'block';
      return;
    }

    playerIndex++;
    if (playerIndex >= sequence.length) {
      message.textContent = 'Great!';
      setTimeout(nextRound, 700);
    }
  }

  startBtn.addEventListener('click', playRound);

  // Button presses - both click and touch
  document.querySelectorAll('.button').forEach(btn => {
    const idx = parseInt(btn.dataset.index);
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); playerPress(idx); });
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); playerPress(idx); }, { passive: false });
  });
})();
</script>
</body>
</html>
