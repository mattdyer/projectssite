<!DOCTYPE html>
<html lang="en">

<title>QR Code Generator</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
  h1{font-size:2rem;margin-bottom:8px;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
  .subtitle{color:#aaa;margin-bottom:24px;font-size:0.95rem;text-align:center}
  .app{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px;max-width:520px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
  label{display:block;font-size:0.85rem;color:#aaa;margin-bottom:4px;margin-top:14px;text-transform:uppercase;letter-spacing:0.5px}
  input[type=text],input[type=number],input[type=color]{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(255,255,255,0.07);color:#e0e0e0;font-size:1rem;outline:none;transition:border-color 0.2s}
  input[type=text]:focus,input[type=number]:focus{border-color:#3a7bd5}
  input[type=color]{height:44px;cursor:pointer;padding:4px}
  .row{display:flex;gap:12px}
  .row>*{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;margin-top:18px;width:100%}
  .btn:active{transform:scale(0.97)}
  .btn-primary{background:linear-gradient(135deg,#3a7bd5,#00d2ff);color:#fff;box-shadow:0 4px 15px rgba(58,123,213,0.4)}
  .btn-secondary{background:rgba(255,255,255,0.1);color:#e0e0e0;margin-top:10px}
  .btn-secondary:hover{background:rgba(255,255,255,0.18)}
  #qr-output{text-align:center;margin-top:24px;display:none}
  #qr-output canvas{border-radius:12px;max-width:100%;height:auto;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
  .size-display{text-align:center;color:#888;font-size:0.8rem;margin-top:6px}
  .examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .examples button{padding:6px 10px;border:1px solid rgba(255,255,255,0.12);border-radius:6px;background:rgba(255,255,255,0.06);color:#bbb;font-size:0.75rem;cursor:pointer;transition:background 0.2s}
  .examples button:hover{background:rgba(58,123,213,0.3);color:#fff}
  footer{margin-top:30px;color:#666;font-size:0.8rem;text-align:center}
  @media(max-width:480px){
    body{padding:12px}
    .app{padding:18px}
    h1{font-size:1.5rem}
  }
</style>
</head>
<body>

<h1>QR Code Generator</h1>
<p class="subtitle">Type anything — URL, text, email — and get a QR code instantly.</p>

<div class="app">
  <label for="input-text">Content</label>
  <input type="text" id="input-text" placeholder="https://example.com or any text..." autocomplete="off">
  <div class="examples">
    <button onclick="setExample('https://mattdyer.us')">Website URL</button>
    <button onclick="setExample('mailto:hello@example.com')">Email</button>
    <button onclick="setExample('HELLO WORLD')">Text</button>
    <button onclick="setExample('+1-555-0123')">Phone</button>
  </div>

  <div class="row">
    <div>
      <label for="qr-size">Size (px)</label>
      <input type="number" id="qr-size" value="256" min="128" max="512" step="32">
    </div>
    <div>
      <label for="qr-color">Color</label>
      <input type="color" id="qr-color" value="#ffffff">
    </div>
  </div>

  <button class="btn btn-primary" onclick="generate()">⚡ Generate QR Code</button>

  <div id="qr-output">
    <canvas id="qr-canvas"></canvas>
    <div class="size-display" id="size-display"></div>
    <button class="btn btn-secondary" onclick="downloadQR()">⬇ Download PNG</button>
  </div>
</div>

<footer>100% client-side — nothing leaves your browser.</footer>

        case 3:return(i+j)%3==0;

          var isSame=true;
          var thisModule=model.modules[row][col];
          if(row<size-1){
            if(model.modules[row+1][col]!=thisModule)isSame=false;
          }
          if(col<size-1){
            if(model.modules[row][col+1]!=thisModule)isSame=false;
          }
          if(isSame)moduleCount++;
        }
      }
      return Math.floor(moduleCount/2);
    };
    this.getH2Loss=function(model){
      var size=model.modules.moduleCount;
      var moduleCount=0;
      for(var row=0;row<size-1;row++){
        for(var col=0;col<size-1;col++){
          var count=0;
          if(model.modules[row][col].isDark)count++;
          if(model.modules[row+1][col].isDark)count++;
          if(model.modules[row][col+1].isDark)count++;
          if(model.modules[row+1][col+1].isDark)count++;
          if(count==0||count==4)moduleCount++;

      }

    };

          totalCount++;

      var ratio=Math.abs((darkCount*100/totalCount)-50);
      return Math.floor(ratio*10/5);

  QRCode.prototype.init=function(){
    var ecLevel=this.getECLevel();
    var text=this.text;
    if(!text)return;
    var model=this.makeModel(text,ecLevel);
    this.model=model;
    this.moduleCount=model.moduleCount;
    this.modules=[];
    for(var r=0;r<model.moduleCount;r++){
      this.modules[r]=[];
      for(var c=0;c<model.moduleCount;c++){
        this.modules[r][c]=false;
      }
    }
    this.drawGrid();
    this.canvas.width=this.size;
    this.canvas.height=this.size;
  };

  QRCode.prototype.getECLevel=function(){

  QRCode.prototype.makeModel=function(text,ecLevel){

    var ecBlocks=ECCBlocks[(this.typeNumber||1)-1][ecLevel];
    var totalData=0;
    for(var i=0;i<ecBlocks.length;i++)totalData+=ecBlocks[i][1];
    var totalEC=0;
    for(var i=0;i<ecBlocks.length;i++)totalEC+=ecBlocks[i][2];

    var dataCodewords=[];
    for(var i=0;i<totalData;i++)dataCodewords.push(paddedData[i]);

    var ecCodewords=[];
    var ecOffset=0;
    for(var b=0;b<ecBlocks.length;b++){

  var GF_LOG_TABLE=new Array(256),GF_EXP_TABLE=new Array(512);

  function GFEncode(data,ecLen){
    var poly=new Array(ecLen);
    for(var i=0;i<ecLen;i++)poly[i]=0;
    poly[ecLen-1]=1;
    for(var i=0;i<data.length;i++){
      var factor=GF_LOG_TABLE[data[i]];
      if(factor==0)continue;
      for(var j=ecLen-1;j>=0;j--){
        if(j>0)poly[j]=(poly[j-1]^(GF_EXP_TABLE[(GF_LOG_TABLE[poly[j]]+factor)%255])|0)|0;
        else poly[j]=GF_EXP_TABLE[(GF_LOG_TABLE[poly[j]]+factor)%255];
      }
    }
    return poly;
  }

            case 7:dark=((r*c)%3+(r+c)%2)%2==0;break;
          }
          modules[r][c]={isDark:dark,category:3};
        }
      }
    }
  };

  QRCode.prototype.getLoss=function(modules,moduleCount){
    var score=0;
    for(var r=0;r<moduleCount;r++){
      for(var c=0;c<moduleCount;c++){
        if(c>=3){
          var same=true;
          for(var d=1;d<=3;d++){if(modules[r][c].isDark!=modules[r][c-d].isDark)same=false;}
          if(same)score+=3;
        }
        if(r>=3){
          var same=true;
          for(var d=1;d<=3;d++){if(modules[r][c].isDark!=modules[r-d][c].isDark)same=false;}
          if(same)score+=3;
        }
        if(r>=1&&r<moduleCount-1&&c>=1&&c<moduleCount-1){
          var count=0;
          if(modules[r][c].isDark)count++;
          if(modules[r-1][c].isDark)count++;
          if(modules[r+1][c].isDark)count++;
          if(modules[r][c-1].isDark)count++;
          if(modules[r][c+1].isDark)count++;
          if(count==0||count==5)score+=3;
        }
      }
    }
    return score;
  };

  QRCode.prototype.drawGrid=function(){
    var size=this.size,margin=this.margin;
    var cellSize=(size-2*margin)/this.moduleCount;
    var ctx=this.ctx;
    ctx.fillStyle=this.lightColor;
    ctx.fillRect(0,0,size,size);
    for(var r=0;r<this.moduleCount;r++){
      for(var c=0;c<this.moduleCount;c++){
        if(this.modules[r][c].isDark){
          ctx.fillStyle=this.darkColor;
          ctx.fillRect(margin+c*cellSize,margin+r*cellSize,cellSize+0.5,cellSize+0.5);
        }
      }
    }
  };

  if(typeof window!=='undefined'){
    window.QRCode=QRCode;
  }

})();

/* ============ UI Logic ============ */
function setExample(t){document.getElementById('input-text').value=t;generate();}
function generate(){
  var text=document.getElementById('input-text').value.trim();
  if(!text){alert('Please enter some text or a URL.');return;}
  var size=parseInt(document.getElementById('qr-size').value)||256;
  var dark=document.getElementById('qr-color').value;
  var canvas=document.getElementById('qr-canvas');
  var qc=new QRCode(canvas,text,{size:size,margin:2,darkColor:dark,lightColor:'#ffffff',errorCorrectionLevel:'M'});
  document.getElementById('qr-output').style.display='block';
  document.getElementById('size-display').textContent=size+' × '+size+' px';
}
function downloadQR(){
  var canvas=document.getElementById('qr-canvas');
  var link=document.createElement('a');
  link.download='qrcode.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}
document.getElementById('input-text').addEventListener('keydown',function(e){if(e.key==='Enter')generate();});
</script>
