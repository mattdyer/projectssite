<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Conway's Game of Life</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    touch-action: manipulation;
  }
  h1 {
    margin-top: 12px;
    font-size: clamp(18px, 4vw, 28px);
    color: #7fdbca;
    text-shadow: 0 0 10px rgba(127,219,202,0.4);
    letter-spacing: 1px;
  }
  .info-bar {
    display: flex;
    gap: 16px;
    margin: 8px 0;
    font-size: 14px;
    color: #aaa;
    flex-wrap: wrap;
    justify-content: center;
  }
  .info-bar span { background: #1a1a2e; padding: 4px 10px; border-radius: 6px; }
  #grid {
    border: 1px solid #333;
    border-radius: 4px;
    cursor: crosshair;
    touch-action: none;
    background: #111;
    image-rendering: pixelated;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
    justify-content: center;
    align-items: center;
  }
  button {
    background: #1a1a2e;
    color: #7fdbca;
    border: 1px solid #7fdbca44;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }
  button:hover, button:active {
    background: #7fdbca;
    color: #0a0a1a;
  }
  button.active {
    background: #7fdbca;
    color: #0a0a1a;
  }
  .speed-control {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #aaa;
    font-size: 13px;
  }
  input[type="range"] {
    width: 80px;
    accent-color: #7fdbca;
  }
  .patterns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0 16px;
    justify-content: center;
  }
  .patterns button {
    font-size: 12px;
    padding: 6px 12px;
  }
  .footer {
    font-size: 11px;
    color: #555;
    margin-bottom: 10px;
    text-align: center;
    padding: 0 10px;
  }
  .footer a { color: #7fdbca; text-decoration: none; }
</style>
</head>
<body>

<h1>Conway's Game of Life</h1>
<div class="info-bar">
  <span>Gen: <strong id="gen">0</strong></span>
  <span>Pop: <strong id="pop">0</strong></span>
  <span>Size: <strong id="size-label">—</strong></span>
</div>

<canvas id="grid"></canvas>

<div class="controls">
  <button id="play-btn" onclick="togglePlay()">▶ Play</button>
  <button onclick="step()">⏭ Step</button>
  <button onclick="clearGrid()">✖ Clear</button>
  <button onclick="randomize()">🎲 Random</button>
  <div class="speed-control">
    Speed:
    <input type="range" id="speed" min="1" max="60" value="12">
    <span id="speed-val">12 fps</span>
  </div>
</div>

<div class="patterns">
  <button onclick="placePattern('glider')">Glider</button>
  <button onclick="placePattern('lwss')">LWSS</button>
  <button onclick="placePattern('pulsar')">Pulsar</button>
  <button onclick="placePattern('gosper')">Glider Gun</button>
  <button onclick="placePattern('rpentomino')">R-Pentomino</button>
  <button onclick="placePattern('acorn')">Acorn</button>
  <button onclick="placePattern('diehard')">Diehard</button>
  <button onclick="placePattern('cosmos')">Cosmic Rail</button>
</div>

<div class="footer">
  Click or drag to draw • <a href="https://en.wikipedia.org/wiki/Conway%27s_Game_of_Life" target="_blank">Learn more</a>
</div>

<script>
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speed-val');
const genEl = document.getElementById('gen');
const popEl = document.getElementById('pop');
const sizeLabel = document.getElementById('size-label');
const playBtn = document.getElementById('play-btn');

// Grid settings
const CELL_SIZE = window.innerWidth < 600 ? 10 : 14;
let cols, rows, grid, nextGrid;
let generation = 0;
let playing = false;
let animFrameId = null;
let lastUpdate = 0;
let isDrawing = false;
let drawValue = 1; // what to draw (0 or 1)
let drawMode = 'toggle'; // 'toggle', 'draw', 'erase'

function init() {
  // Fit canvas to viewport
  const maxW = Math.min(window.innerWidth - 20, 900);
  const maxH = Math.min(window.innerHeight - 260, 600);
  cols = Math.floor(maxW / CELL_SIZE);
  rows = Math.floor(maxH / CELL_SIZE);
  canvas.width = cols * CELL_SIZE;
  canvas.height = rows * CELL_SIZE;
  sizeLabel.textContent = `${cols}×${rows}`;

  grid = new Uint8Array(cols * rows);
  nextGrid = new Uint8Array(cols * rows);

  draw();
}

function idx(x, y) { return y * cols + x; }

function countNeighbors(x, y) {
  let count = 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = (x + dx + cols) % cols;
      const ny = (y + dy + rows) % rows;
      count += grid[idx(nx, ny)];
    }
  }
  return count;
}

function step() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y);
      const n = countNeighbors(x, y);
      const alive = grid[i];
      nextGrid[i] = (alive && (n === 2 || n === 3)) || (!alive && n === 3) ? 1 : 0;
    }
  }
  const tmp = grid;
  grid = nextGrid;
  nextGrid = tmp;
  generation++;
  updateStats();
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grid lines
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= cols; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL_SIZE, 0);
    ctx.lineTo(x * CELL_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL_SIZE);
    ctx.lineTo(canvas.width, y * CELL_SIZE);
    ctx.stroke();
  }

  // Draw cells
  let pop = 0;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[idx(x, y)]) {
        pop++;
        const n = countNeighbors(x, y);
        // Color based on neighbor count
        const colors = ['#7fdbca', '#5bc0be', '#48b0a0', '#359f8f', '#228e7e'];
        ctx.fillStyle = colors[Math.min(n, 4)];
        ctx.shadowColor = '#7fdbca';
        ctx.shadowBlur = 3;
        ctx.fillRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        ctx.shadowBlur = 0;
      }
    }
  }

  popEl.textContent = pop;
}

function updateStats() {
  genEl.textContent = generation;
}

function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
  playBtn.classList.toggle('active', playing);
  if (playing) {
    lastUpdate = performance.now();
    loop();
  } else {
    cancelAnimationFrame(animFrameId);
  }
}

function loop() {
  if (!playing) return;
  const now = performance.now();
  const fps = parseInt(speedSlider.value);
  const interval = 1000 / fps;
  if (now - lastUpdate >= interval) {
    step();
    draw();
    lastUpdate = now;
  }
  animFrameId = requestAnimationFrame(loop);
}

function getGridPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((clientX - rect.left) / CELL_SIZE);
  const y = Math.floor((clientY - rect.top) / CELL_SIZE);
  return { x, y };
}

function paintCell(x, y) {
  if (x < 0 || x >= cols || y < 0 || y >= rows) return;
  if (drawMode === 'draw') grid[idx(x, y)] = 1;
  else if (drawMode === 'erase') grid[idx(x, y)] = 0;
  else grid[idx(x, y)] = 1 - grid[idx(x, y)];
}

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  isDrawing = true;
  const { x, y } = getGridPos(e.clientX, e.clientY);
  if (grid[idx(x, y)]) {
    drawMode = 'erase';
    drawValue = 0;
  } else {
    drawMode = 'draw';
    drawValue = 1;
  }
  paintCell(x, y);
  draw();
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing) return;
  const { x, y } = getGridPos(e.clientX, e.clientY);
  paintCell(x, y);
  draw();
});

canvas.addEventListener('mouseup', () => { isDrawing = false; });
canvas.addEventListener('mouseleave', () => { isDrawing = false; });

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  isDrawing = true;
  const t = e.touches[0];
  const { x, y } = getGridPos(t.clientX, t.clientY);
  drawMode = 'draw';
  paintCell(x, y);
  draw();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const { x, y } = getGridPos(t.clientX, t.clientY);
  paintCell(x, y);
  draw();
}, { passive: false });

canvas.addEventListener('touchend', () => { isDrawing = false; });

function clearGrid() {
  grid.fill(0);
  generation = 0;
  updateStats();
  draw();
  if (playing) togglePlay();
}

function randomize() {
  const density = 0.3;
  for (let i = 0; i < grid.length; i++) {
    grid[i] = Math.random() < density ? 1 : 0;
  }
  generation = 0;
  updateStats();
  draw();
}

function placePattern(name) {
  // Clear first
  grid.fill(0);
  generation = 0;
  updateStats();

  const patterns = {
    glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
    lwss: [[1,0],[4,0],[0,1],[0,2],[4,2],[0,3],[1,3],[2,3],[3,3]],
    pulsar: (function() {
      const p = [];
      const offsets = [
        [2,0],[3,0],[4,0],[8,0],[9,0],[10,0],
        [0,2],[5,2],[7,2],[12,2],
        [0,3],[5,3],[7,3],[12,3],
        [0,4],[5,4],[7,4],[12,4],
        [2,5],[3,5],[4,5],[8,5],[9,5],[10,5],
      ];
      for (const [x,y] of offsets) {
        p.push([x,y]);
        p.push([x, 12-y]);
      }
      // Deduplicate
      const seen = new Set();
      return p.filter(([x,y]) => {
        const k = `${x},${y}`;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    })(),
    gosper: [
      [24,0],[22,1],[24,1],[12,2],[13,2],[20,2],[21,2],[34,2],[35,2],
      [11,3],[15,3],[20,3],[21,3],[34,3],[35,3],[0,4],[1,4],[10,4],[16,4],[20,4],[21,4],
      [0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],
      [10,6],[16,6],[24,6],[11,7],[15,7],[12,8],[13,8]
    ],
    rpentomino: [[1,0],[2,0],[0,1],[1,1],[1,2]],
    acorn: [[1,0],[3,1],[0,2],[1,2],[4,2],[5,2],[6,2]],
    diehard: [[6,0],[0,1],[1,1],[1,2],[5,2],[6,2],[7,2]],
    cosmos: [[1,0],[0,1],[1,1],[0,3],[1,3],[2,3],[3,3],[0,4],[1,4],[2,4],[3,4],[0,5],[1,5],[2,5],[3,5],[0,7],[1,7],[2,7],[3,7]]
  };

  const pat = patterns[name];
  if (!pat) return;

  // Center the pattern
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x, y] of pat) {
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x);
    maxY = Math.max(maxY, y);
  }
  const pw = maxX - minX + 1;
  const ph = maxY - minY + 1;
  const ox = Math.floor((cols - pw) / 2) - minX;
  const oy = Math.floor((rows - ph) / 2) - minY;

  for (const [x, y] of pat) {
    const nx = x + ox, ny = y + oy;
    if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
      grid[idx(nx, ny)] = 1;
    }
  }

  draw();
}

// Speed display
speedSlider.addEventListener('input', () => {
  speedVal.textContent = speedSlider.value + ' fps';
});

// Handle resize
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    const wasPlaying = playing;
    if (playing) togglePlay();
    init();
    if (wasPlaying) togglePlay();
  }, 300);
});

// Init
init();
</script>

</body>
</html>
