<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Music Visualizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    flex: 1;
    width: 100%;
    cursor: crosshair;
  }
  #controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(10,10,26,0.97) 60%, rgba(10,10,26,0));
    padding: 12px 16px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #controls button, #controls label, #controls select {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e0e0f0;
    padding: 8px 14px;
    border-radius: 24px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  #controls button:hover, #controls button.active {
    background: rgba(120,80,255,0.35);
    border-color: rgba(120,80,255,0.6);
  }
  #controls button.active { box-shadow: 0 0 12px rgba(120,80,255,0.4); }
  #controls label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #controls select { font-size: 13px; padding: 6px 10px; }
  #controls input[type="color"] {
    width: 36px; height: 36px; border: none; padding: 0; border-radius: 50%;
    cursor: pointer; background: none;
  }
  #controls input[type="range"] {
    width: 80px; accent-color: #7850ff;
  }
  #startOverlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,26,0.92);
    z-index: 100;
    flex-direction: column; gap: 20px;
    transition: opacity 0.5s;
  }
  #startOverlay.hidden { opacity: 0; pointer-events: none; }
  #startOverlay h1 {
    font-size: clamp(24px, 5vw, 42px);
    background: linear-gradient(135deg, #7850ff, #ff6090, #00d0ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; text-align: center;
  }
  #startOverlay p { color: #8888aa; font-size: 15px; max-width: 320px; text-align: center; line-height: 1.5; }
  #startBtn {
    background: linear-gradient(135deg, #7850ff, #a060ff);
    border: none; color: white; padding: 16px 40px;
    border-radius: 32px; font-size: 18px; cursor: pointer;
    box-shadow: 0 4px 24px rgba(120,80,255,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #startBtn:hover { transform: scale(1.05); box-shadow: 0 6px 32px rgba(120,80,255,0.6); }
  #volumeBar {
    position: fixed; left: 16px; top: 16px;
    width: 6px; height: 120px; background: rgba(255,255,255,0.06);
    border-radius: 3px; z-index: 10; overflow: hidden;
  }
  #volumeFill {
    position: absolute; bottom: 0; width: 100%; height: 0%;
    background: linear-gradient(to top, #7850ff, #ff6090);
    border-radius: 3px; transition: height 0.05s;
  }
  #info {
    position: fixed; top: 16px; right: 16px;
    font-size: 11px; color: #555577; z-index: 10;
    text-align: right; line-height: 1.6;
  }
  @media (max-width: 500px) {
    #controls { padding: 8px 8px 14px; gap: 6px; }
    #controls button, #controls label, #controls select { padding: 6px 10px; font-size: 12px; }
    #controls input[type="range"] { width: 60px; }
  }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>🎵 Music Visualizer</h1>
  <p>Use your microphone to visualize sound. Pick a style, adjust sensitivity, and enjoy the show.</p>
  <button id="startBtn">🎤 Start Listening</button>
</div>

<canvas id="canvas"></canvas>

<div id="volumeBar"><div id="volumeFill"></div></div>
<div id="info"></div>

<div id="controls">
  <button id="btnBars" class="active" data-mode="bars">Bars</button>
  <button id="btnCircles" data-mode="circles">Circles</button>
  <button id="btnWaves" data-mode="waves">Waves</button>
  <button id="btnRays" data-mode="rays">Rays</button>
  <button id="btnParticles" data-mode="particles">Particles</button>
  <label>Sensitivity
    <input type="range" id="sensitivity" min="0.5" max="4" step="0.1" value="1.8">
  </label>
  <label>Smoothing
    <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.6">
  </label>
  <label>
    <select id="bgSelect">
      <option value="dark">Dark BG</option>
      <option value="gradient">Gradient</option>
      <option value="stars">Starfield</option>
    </select>
  </label>
  <button id="btnFullscreen" title="Fullscreen">⛶</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const volFill = document.getElementById('volumeFill');
const infoEl = document.getElementById('info');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (W > 0 && H > 0) initStars();
}
// --- State ---
let audioCtx, analyser, micStream, dataArray, freqData;
let mode = 'bars';
let sensitivity = 1.8;
let smoothing = 0.6;
let bgMode = 'dark';
let started = false;
let startTime = 0;
let particles = [];
let stars = [];

window.addEventListener('resize', resize);
resize();

// --- Stars background ---
function initStars() {
  if (stars.length > 0) {
    // Preserve existing stars, just clamp positions to new bounds
    for (const s of stars) {
      s.x = Math.min(s.x, W);
      s.y = Math.min(s.y, H);
    }
    return;
  }
  stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 0.3 + 0.05,
      twinkle: Math.random() * Math.PI * 2
    });
  }
}

// --- Init Audio ---
document.getElementById('startBtn').addEventListener('click', async () => {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = smoothing;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    started = true;
    startTime = performance.now();
    document.getElementById('startOverlay').classList.add('hidden');
    loop();
  } catch(e) {
    alert('Microphone access is required. Please allow mic access and try again.');
  }
});

// --- Controls ---
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    particles = [];
  });
});
document.getElementById('sensitivity').addEventListener('input', e => sensitivity = parseFloat(e.target.value));
document.getElementById('smoothing').addEventListener('input', e => {
  smoothing = parseFloat(e.target.value);
  if (analyser) analyser.smoothingTimeConstant = smoothing;
});
document.getElementById('bgSelect').addEventListener('change', e => bgMode = e.target.value);
document.getElementById('btnFullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

// --- Helpers ---
function avg(arr) { if (!arr || arr.length === 0) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; }

function getVolume() {
  if (!analyser || !dataArray) return 0;
  const avgVal = avg(dataArray);
  return Math.max(0, Math.min(1, (avgVal - 128) / 128));
}

function getFreqRange(start, end) {
  if (!analyser) return 0;
  const s = Math.floor(start * freqData.length);
  const e = Math.floor(end * freqData.length);
  if (e <= s) return 0;
  const slice = freqData.slice(s, e);
  return avg(slice) / 255;
}

// --- Draw functions ---
function drawDarkBG() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
}

function drawGradientBG(t) {
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, `hsl(${(240 + t*0.01) % 360}, 30%, 8%)`);
  grad.addColorStop(1, `hsl(${(280 + t*0.015) % 360}, 40%, 12%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawStarsBG(t) {
  drawDarkBG();
  for (const s of stars) {
    s.y += s.speed;
    s.twinkle += 0.02;
    if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,255,${alpha})`;
    ctx.fill();
  }
}

function drawBars(t) {
  const len = freqData.length;
  const barCount = Math.min(80, Math.floor(len / 2));
  const gap = 2;
  const barW = (W - gap * barCount) / barCount;

  for (let i = 0; i < barCount; i++) {
    const idx = Math.floor(i * len / barCount);
    const val = (freqData[idx] / 255) * sensitivity;
    const barH = Math.max(2, val * H * 0.75);
    const x = i * (barW + gap) + gap / 2;
    const hue = (i / barCount) * 60 + (t * 0.02);

    const grad = ctx.createLinearGradient(0, H, 0, H - barH);
    grad.addColorStop(0, `hsla(${hue + 240}, 80%, 55%, 0.9)`);
    grad.addColorStop(1, `hsla(${hue + 280}, 90%, 70%, 0.3)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x, H - barH, barW, barH);

    // Mirror
    ctx.fillStyle = `hsla(${hue + 240}, 80%, 55%, 0.1)`;
    ctx.fillRect(x, H, barW, barH * 0.15);
  }
}

function drawCircles(t) {
  const cx = W / 2, cy = H / 2;
  const bass = getFreqRange(0, 0.08) * sensitivity;
  const mid = getFreqRange(0.08, 0.4) * sensitivity;

  // Outer ring - high freq
  const segCount = 64;
  for (let i = 0; i < segCount; i++) {
    const idx = Math.floor(i * freqData.length / segCount);
    const val = (freqData[idx] / 255) * sensitivity;
    const angle = (i / segCount) * Math.PI * 2 + t * 0.003;
    const innerR = 80 + bass * 80;
    const outerR = innerR + val * 120 + 20;
    const x1 = cx + Math.cos(angle) * innerR;
    const y1 = cy + Math.sin(angle) * innerR;
    const x2 = cx + Math.cos(angle) * outerR;
    const y2 = cy + Math.sin(angle) * outerR;
    const hue = (i / segCount) * 120 + 240;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `hsla(${hue}, 85%, 65%, ${0.5 + val * 0.5})`;
    ctx.lineWidth = Math.max(2, W / segCount * 0.6);
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Inner pulsing circle
  const pulseR = 50 + bass * 60;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulseR);
  grad.addColorStop(0, `hsla(${260 + t*0.05}, 90%, 70%, 0.6)`);
  grad.addColorStop(1, `hsla(${280 + t*0.05}, 80%, 50%, 0)`);
  ctx.beginPath();
  ctx.arc(cx, cy, pulseR, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Middle ring
  for (let i = 0; i < 32; i++) {
    const idx = Math.floor(i * freqData.length / 32);
    const val = (freqData[idx] / 255) * sensitivity;
    const angle = (i / 32) * Math.PI * 2 - t * 0.005;
    const r2 = 140 + mid * 50;
    const x = cx + Math.cos(angle) * r2;
    const y = cy + Math.sin(angle) * r2;
    ctx.beginPath();
    ctx.arc(x, y, 3 + val * 12, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${(i/32)*120 + 200}, 80%, 65%, ${0.4 + val * 0.6})`;
    ctx.fill();
  }
}

function drawWaves(t) {
  // Multiple wave layers
  for (let layer = 0; layer < 5; layer++) {
    const alpha = 0.6 - layer * 0.1;
    const yOff = (layer - 2) * 30;
    const ampMod = 1 - layer * 0.15;

    ctx.beginPath();
    ctx.moveTo(0, H / 2 + yOff);

    for (let x = 0; x < W; x++) {
      const idx = Math.floor(x / W * dataArray.length);
      const val = (dataArray[idx] - 128) / 128;
      const y = H / 2 + yOff + val * 100 * ampMod * sensitivity + Math.sin(x * 0.01 + t * 0.005 + layer) * 20 * ampMod;
      ctx.lineTo(x, y);
    }

    const hue = 240 + layer * 25;
    ctx.strokeStyle = `hsla(${hue}, 85%, 60%, ${alpha})`;
    ctx.lineWidth = 3 - layer * 0.3;
    ctx.stroke();
  }

  // Glow fill
  ctx.beginPath();
  ctx.moveTo(0, H / 2);
  for (let x = 0; x < W; x++) {
    const idx = Math.floor(x / W * dataArray.length);
    const val = (dataArray[idx] - 128) / 128;
    const y = H / 2 + val * 100 * sensitivity;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `hsla(${260}, 80%, 50%, 0.08)`);
  grad.addColorStop(1, `hsla(${260}, 80%, 50%, 0)`);
  ctx.fillStyle = grad;
  ctx.fill();
}

function drawRays(t) {
  const cx = W / 2, cy = H / 2;
  const bass = getFreqRange(0, 0.06) * sensitivity;

  // Center glow
  const glowR = 60 + bass * 80;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
  grad.addColorStop(0, `hsla(${260}, 90%, 75%, 0.5)`);
  grad.addColorStop(0.5, `hsla(${280}, 80%, 50%, 0.15)`);
  grad.addColorStop(1, `hsla(${300}, 70%, 40%, 0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Rays
  const rayCount = 48;
  for (let i = 0; i < rayCount; i++) {
    const idx = Math.floor(i * freqData.length / rayCount);
    const val = (freqData[idx] / 255) * sensitivity;
    const angle = (i / rayCount) * Math.PI * 2 + t * 0.002;
    const len = 100 + val * Math.max(W, H) * 0.45;
    const x2 = cx + Math.cos(angle) * len;
    const y2 = cy + Math.sin(angle) * len;

    const hue = (i / rayCount) * 100 + 240;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${0.15 + val * 0.6})`;
    ctx.lineWidth = Math.max(1, W / rayCount * 0.4 + val * 4);
    ctx.stroke();
  }

  // Beat flash
  if (bass > 0.6) {
    ctx.fillStyle = `rgba(120,80,255,${(bass - 0.6) * 0.15})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawParticles(t) {
  const bass = getFreqRange(0, 0.08) * sensitivity;
  const mid = getFreqRange(0.08, 0.4) * sensitivity;

  // Spawn particles on beat
  if (bass > 0.35 && particles.length < 500) {
    const count = Math.floor(bass * 15);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4 * bass;
      particles.push({
        x: W / 2, y: H / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.003 + Math.random() * 0.008,
        r: 1 + Math.random() * 3 + mid * 4,
        hue: (Math.random() * 80 + 240)
      });
    }
  }

  // Spawn ambient
  if (particles.length < 300 && mid > 0.1) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2 - 0.5,
      life: 1,
      decay: 0.005 + Math.random() * 0.01,
      r: 1 + Math.random() * 2,
      hue: 260 + Math.random() * 40
    });
  }

  // Update and draw
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02; // slight gravity
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 80%, 65%, ${p.life * 0.7})`;
    ctx.fill();
  }

  // Connection lines between nearby particles
  const maxDist = 60;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < Math.min(i + 20, particles.length); j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < maxDist) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `hsla(${particles[i].hue}, 70%, 60%, ${(1 - dist/maxDist) * 0.2})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// --- Main loop ---
function loop() {
  const t = performance.now() - startTime;

  // Background
  if (bgMode === 'gradient') drawGradientBG(t);
  else if (bgMode === 'stars') drawStarsBG(t);
  else drawDarkBG();

  // Visualize
  if (started && analyser) {
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(dataArray);
    switch(mode) {
      case 'bars': drawBars(t); break;
      case 'circles': drawCircles(t); break;
      case 'waves': drawWaves(t); break;
      case 'rays': drawRays(t); break;
      case 'particles': drawParticles(t); break;
    }
  }

  // Volume bar
  const vol = Math.min(100, getVolume() * sensitivity * 150);
  volFill.style.height = vol + '%';

  // Info
  infoEl.textContent = `${mode} · ${Math.round(sensitivity*10)/10}× sens · ${Math.round(t/1000)}s`;

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
