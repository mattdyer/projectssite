<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gravity Soccer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #ui {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #score {
    font-size: 28px;
    font-weight: bold;
    color: #ff6b6b;
  }
  #info {
    font-size: 14px;
    color: #aaa;
  }
  canvas {
    border: 2px solid #444;
    border-radius: 8px;
    background: #2d6a2d;
    max-width: 98vw;
    max-height: 70vh;
  }
  #controls {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #4a4a8a;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #6a6aaa; }
  button:active { background: #3a3a6a; }
  #goal-flash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 215, 0, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="ui">
  <span id="score">⚽ 0 — 0 🥅</span>
  <span id="info">Click/tap to kick the ball!</span>
</div>
<canvas id="game" width="800" height="500"></canvas>
<div id="controls">
  <button id="btn-reset">New Game</button>
  <button id="btn-power">Power: Medium</button>
</div>
<div id="goal-flash">GOAL! ⚽</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const infoEl = document.getElementById('info');
const goalFlash = document.getElementById('goal-flash');
const btnReset = document.getElementById('btn-reset');
const btnPower = document.getElementById('btn-power');

// Scale canvas for mobile
function resizeCanvas() {
  const maxW = Math.min(window.innerWidth * 0.98, 800);
  const maxH = window.innerHeight * 0.65;
  const ratio = 800 / 500;
  let w = maxW;
  let h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Game state
const GRAVITY = 0.35;
const FRICTION = 0.985;
const BOUNCE = 0.65;

let playerScore = 0;
let cpuScore = 0;
let powerLevel = 1; // 1=soft, 2=medium, 3=hard
const powerLabels = { 1: 'Soft', 2: 'Medium', 3: 'Hard' };

// Ball
const ball = {
  x: 400, y: 400, r: 14,
  vx: 0, vy: 0,
  trail: []
};

// Goal (top center)
const goal = { x: 300, y: 30, w: 200, h: 40 };

// Goalkeeper (CPU)
const keeper = {
  x: 400, y: 70, w: 40, h: 25,
  vx: 2, targetX: 400,
  speed: 2.5
};

// Player foot (bottom, follows mouse/touch for aiming)
const foot = { x: 400, y: 460 };

let mouseX = 400, mouseY = 460;
let gameActive = true;
let goalCooldown = 0;

function resetBall() {
  ball.x = 400;
  ball.y = 350;
  ball.vx = (Math.random() - 0.5) * 4;
  ball.vy = -2 - Math.random() * 3;
  ball.trail = [];
}

function resetGame() {
  playerScore = 0;
  cpuScore = 0;
  keeper.speed = 2.5;
  keeper.x = 400;
  gameActive = true;
  resetBall();
  updateScore();
}

function updateScore() {
  scoreEl.textContent = `⚽ ${playerScore} — ${cpuScore} 🥅`;
}

// Goalkeeper AI
function updateKeeper() {
  // Predict where ball will be
  let predictX = ball.x + ball.vx * 20;
  predictX = Math.max(goal.x + 20, Math.min(goal.x + goal.w - 20, predictX));

  // Smoothly follow
  let diff = predictX - keeper.x;
  keeper.x += diff * 0.04 * keeper.speed;
  keeper.x = Math.max(goal.x + 10, Math.min(goal.x + goal.w - keeper.w - 10, keeper.x));
}

// Check if ball is in goal
function checkGoal() {
  if (goalCooldown > 0) return;
  if (ball.vy < 0 && ball.y < goal.y + goal.h &&
      ball.y > goal.y - 10 &&
      ball.x > goal.x && ball.x < goal.x + goal.w) {
    playerScore++;
    goalCooldown = 120;
    keeper.speed += 0.3;
    updateScore();

    // Flash effect
    goalFlash.style.display = 'flex';
    setTimeout(() => { goalFlash.style.display = 'none'; }, 1200);

    setTimeout(() => { resetBall(); }, 1400);
  }
}

// Check collision with keeper
function checkKeeperCollision() {
  // Simple AABB vs circle
  let closestX = Math.max(keeper.x, Math.min(ball.x, keeper.x + keeper.w));
  let closestY = Math.max(keeper.y, Math.min(ball.y, keeper.y + keeper.h));
  let dx = ball.x - closestX;
  let dy = ball.y - closestY;
  let dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < ball.r + 5) {
    // Bounce away
    let angle = Math.atan2(dy, dx);
    ball.vx = Math.cos(angle) * 6;
    ball.vy = Math.sin(angle) * 6 + 2;
    ball.x = closestX + Math.cos(angle) * (ball.r + 8);
    ball.y = closestY + Math.sin(angle) * (ball.r + 8);
    infoEl.textContent = '🧤 Saved by the keeper!';
    setTimeout(() => { infoEl.textContent = 'Click/tap to kick the ball!'; }, 1500);
  }
}

// Kick ball toward mouse position
function kickBall() {
  if (!gameActive) return;
  let dx = foot.x - ball.x;
  let dy = foot.y - ball.y;
  let dist = Math.sqrt(dx * dx + dy * dy);
  if (dist === 0) return;

  let power = powerLevel * 5;
  ball.vx = (dx / dist) * power;
  ball.vy = (dy / dist) * power;
  infoEl.textContent = '⚡ Kicked!';
}

// Input handling
function handleInput(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouseX = (cx - rect.left) * scaleX;
  mouseY = (cy - rect.top) * scaleY;
  foot.x = mouseX;
  foot.y = Math.max(ball.y + 50, Math.min(canvas.height - 20, mouseY));
}

canvas.addEventListener('mousemove', (e) => handleInput(e.clientX, e.clientY));
canvas.addEventListener('mousedown', (e) => { handleInput(e.clientX, e.clientY); kickBall(); });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleInput(e.touches[0].clientX, e.touches[0].clientY);
  kickBall();
}, { passive: false });

btnReset.addEventListener('click', resetGame);

const powerCycle = [1, 2, 3];
let powerIdx = 1;
btnPower.addEventListener('click', () => {
  powerIdx = (powerIdx + 1) % powerCycle.length;
  powerLevel = powerCycle[powerIdx];
  btnPower.textContent = 'Power: ' + powerLabels[powerLevel];
});

// Drawing
function drawField() {
  // Grass gradient
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#3a8a3a');
  grad.addColorStop(1, '#2d6a2d');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Field markings
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;

  // Center line
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
  ctx.stroke();

  // Penalty box (top)
  ctx.strokeRect(250, 0, 300, 120);
  ctx.strokeRect(320, 0, 160, 50);

  // Goal
  ctx.fillStyle = '#fff';
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

  // Net pattern
  ctx.strokeStyle = 'rgba(200,200,200,0.5)';
  ctx.lineWidth = 1;
  for (let nx = goal.x; nx <= goal.x + goal.w; nx += 10) {
    ctx.beginPath();
    ctx.moveTo(nx, goal.y);
    ctx.lineTo(nx, goal.y + goal.h);
    ctx.stroke();
  }
  for (let ny = goal.y; ny <= goal.y + goal.h; ny += 10) {
    ctx.beginPath();
    ctx.moveTo(goal.x, ny);
    ctx.lineTo(goal.x + goal.w, ny);
    ctx.stroke();
  }
}

function drawBall() {
  // Trail
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  for (let i = 0; i < ball.trail.length; i++) {
    let t = ball.trail[i];
    let alpha = (i / ball.trail.length) * 0.3;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * (i / ball.trail.length), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }

  // Ball shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(ball.x + 3, ball.y + 3, ball.r, ball.r * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  let ballGrad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 2, ball.x, ball.y, ball.r);
  ballGrad.addColorStop(0, '#fff');
  ballGrad.addColorStop(1, '#ccc');
  ctx.fillStyle = ballGrad;
  ctx.fill();
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Pentagon pattern on ball
  ctx.fillStyle = '#333';
  let angles = [0, Math.PI * 0.4, Math.PI * 0.8, Math.PI * 1.2, Math.PI * 1.6];
  for (let a of angles) {
    let px = ball.x + Math.cos(a + ball.x * 0.02) * ball.r * 0.5;
    let py = ball.y + Math.sin(a + ball.x * 0.02) * ball.r * 0.5;
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawKeeper() {
  // Keeper body
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(keeper.x, keeper.y, keeper.w, keeper.h);

  // Keeper head
  ctx.fillStyle = '#ffaa88';
  ctx.beginPath();
  ctx.arc(keeper.x + keeper.w / 2, keeper.y - 6, 8, 0, Math.PI * 2);
  ctx.fill();

  // Gloves
  ctx.fillStyle = '#4a4a8a';
  ctx.fillRect(keeper.x - 5, keeper.y + 3, 8, 12);
  ctx.fillRect(keeper.x + keeper.w - 3, keeper.y + 3, 8, 12);

  // Number
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('1', keeper.x + keeper.w / 2, keeper.y + 17);
}

function drawFoot() {
  // Aim line
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.lineTo(foot.x, foot.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // Foot indicator
  ctx.fillStyle = '#4a9eff';
  ctx.beginPath();
  ctx.arc(foot.x, foot.y, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Arrow
  let dx = foot.x - ball.x;
  let dy = foot.y - ball.y;
  let dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > 30) {
    let angle = Math.atan2(dy, dx);
    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    ctx.moveTo(ball.x + Math.cos(angle) * 25, ball.y + Math.sin(angle) * 25);
    ctx.lineTo(ball.x + Math.cos(angle - 0.4) * 35, ball.y + Math.sin(angle - 0.4) * 35);
    ctx.lineTo(ball.x + Math.cos(angle + 0.4) * 35, ball.y + Math.sin(angle + 0.4) * 35);
    ctx.closePath();
    ctx.fill();
  }
}

function drawWindIndicator() {
  // Show a small wind indicator
  let windX = ball.x + ball.vx * 15;
  let windY = ball.y + ball.vy * 15;
  if (Math.abs(ball.vx) + Math.abs(ball.vy) > 2) {
    ctx.strokeStyle = 'rgba(255,255,100,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(windX, windY);
    ctx.stroke();
  }
}

// Main game loop
let lastTime = 0;
function gameLoop(time) {
  if (!lastTime) lastTime = time;
  let dt = Math.min((time - lastTime) / 16.67, 2); // normalize to ~60fps
  lastTime = time;

  // Update
  if (goalCooldown > 0) {
    goalCooldown--;
  }

  // Ball physics
  ball.vy += GRAVITY * dt;
  ball.vx *= FRICTION;
  ball.vy *= FRICTION;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  // Trail
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 8) ball.trail.shift();

  // Wall bounces
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * BOUNCE; }
  if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx = -Math.abs(ball.vx) * BOUNCE; }
  if (ball.y + ball.r > canvas.height) { ball.y = canvas.height - ball.r; ball.vy = -Math.abs(ball.vy) * BOUNCE; }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * BOUNCE; }

  updateKeeper();
  checkKeeperCollision();
  checkGoal();

  // Draw
  drawField();
  drawWindIndicator();
  drawKeeper();
  drawBall();
  drawFoot();

  // Speed indicator
  let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (speed > 10) {
    ctx.fillStyle = `rgba(255,${Math.floor(255 - (speed - 10) * 15)},0,0.5)`;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.floor(speed)} km/h`, ball.x, ball.y - ball.r - 10);
  }

  requestAnimationFrame(gameLoop);
}

// Start
updateScore();
resetBall();
infoEl.textContent = 'Click/tap anywhere to kick the ball toward the goal!';
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
