<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    touch-action: none;
    user-select: none;
    overflow: hidden;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
    color: #0f0;
    text-shadow: 0 0 10px #0f0, 0 0 20px #0a0;
    letter-spacing: 0.1em;
  }
  #hud {
    display: flex;
    gap: 2rem;
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
  }
  #hud span { color: #aaa; }
  #hud strong { color: #fff; }
  #gameCanvas {
    border: 2px solid #0f0;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,255,0,0.2);
    background: #0d0d1a;
    display: block;
    max-width: 95vw;
    max-height: 60vh;
  }
  #controls {
    margin-top: 0.75rem;
    display: grid;
    grid-template-areas:
      ".  up  ."
      "left down right";
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 60px);
    gap: 4px;
  }
  #controls button {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    color: #0f0;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }
  #controls button:active { background: #0f3460; }
  #up    { grid-area: up; }
  #down  { grid-area: down; }
  #left  { grid-area: left; }
  #right { grid-area: right; }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 2rem; color: #0f0; margin-bottom: 0.5rem; }
  #overlay p  { font-size: 1.2rem; color: #ccc; margin-bottom: 1rem; }
  #overlay button {
    background: #0f0;
    color: #1a1a2e;
    border: none;
    padding: 0.75rem 2rem;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
  }
  #overlay button:hover { background: #0c0; }
  @media (min-width: 768px) {
    #controls { display: none; }
    #gameCanvas { max-height: 65vh; }
  }
</style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <div id="hud">
    <div><span>Score: </span><strong id="score">0</strong></div>
    <div><span>Best: </span><strong id="best">0</strong></div>
    <div><span>Speed: </span><strong id="speed">1</strong></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div id="overlay">
    <h2 id="overlayTitle">🐍 Snake</h2>
    <p id="overlayMsg">Arrow keys or tap to play</p>
    <button id="overlayBtn">Play</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMsg = document.getElementById('overlayMsg');
  const overlayBtn = document.getElementById('overlayBtn');

  const GRID = 20;
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  let snake, dir, nextDir, food, score, best, speed, interval, alive, running, loopId;

  best = parseInt(localStorage.getItem('snake_best') || '0');
  bestEl.textContent = best;

  function init() {
    const mid = Math.floor(COLS / 2);
    snake = [{x: mid, y: Math.floor(ROWS / 2)}, {x: mid - 1, y: Math.floor(ROWS / 2)}, {x: mid - 2, y: Math.floor(ROWS / 2)}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 1;
    alive = true;
    running = true;
    scoreEl.textContent = 0;
    speedEl.textContent = 1;
    placeFood();
    overlay.classList.add('hidden');
    clearInterval(interval);
    interval = setInterval(tick, Math.max(60, 150 - (speed - 1) * 10));
  }

  function placeFood() {
    let pos;
    do {
      pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function tick() {
    if (!alive || !running) return;
    dir = {...nextDir};
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) { die(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      // Speed up every 3 points
      const newSpeed = 1 + Math.floor(score / 3);
      if (newSpeed !== speed) {
        speed = newSpeed;
        speedEl.textContent = speed;
        clearInterval(interval);
        interval = setInterval(tick, Math.max(60, 150 - (speed - 1) * 10));
      }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function die() {
    alive = false;
    running = false;
    clearInterval(interval);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = '💀 Game Over';
    overlayMsg.textContent = `Score: ${score} | Best: ${best}`;
    overlayBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * GRID, 0); ctx.lineTo(x * GRID, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * GRID); ctx.lineTo(canvas.width, y * GRID); ctx.stroke();
    }

    // Food (pulsing)
    const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
    ctx.fillStyle = `rgba(255,50,50,${pulse})`;
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // Snake
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      const r = Math.round(0 + t * 0);
      const g = Math.round(255 - t * 120);
      const b = Math.round(0 + t * 60);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad * 2, GRID - pad * 2);
      // Glow on head
      if (i === 0) {
        ctx.shadowColor = '#0f0';
        ctx.shadowBlur = 10;
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
        ctx.shadowBlur = 0;
      }
    });
  }

  function setDir(x, y) {
    // Prevent 180° turns
    if (dir.x === -x && dir.y === -y) return;
    if (x !== 0 && dir.x === x) return;
    if (y !== 0 && dir.y === y) return;
    nextDir = {x, y};
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W': e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown':  case 's': case 'S': e.preventDefault(); setDir(0, 1);  break;
      case 'ArrowLeft':  case 'a': case 'A': e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDir(1, 0);  break;
    }
  });

  // On-screen buttons
  document.getElementById('up').addEventListener('click',    () => setDir(0, -1));
  document.getElementById('down').addEventListener('click',  () => setDir(0, 1));
  document.getElementById('left').addEventListener('click',  () => setDir(-1, 0));
  document.getElementById('right').addEventListener('click', () => setDir(1, 0));

  // Touch swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: false});
  canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  });

  // Start button
  overlayBtn.addEventListener('click', init);

  // Initial draw
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  food = {x: 15, y: 10};
  score = 0;
  speed = 1;
  alive = true;
  running = false;
  draw();
})();
</script>
</body>
</html>
