<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Solar System Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
  #info-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 240px;
    background: rgba(10, 10, 40, 0.92);
    border: 1px solid rgba(100, 140, 255, 0.4);
    border-radius: 12px;
    padding: 16px;
    display: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10;
  }
  #info-panel h2 {
    font-size: 18px;
    margin-bottom: 8px;
    color: #7af;
  }
  #info-panel p {
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 4px;
    color: #cde;
  }
  #info-panel .stat { color: #fa5; }
  #info-panel .close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }
  #controls {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(10, 10, 40, 0.85);
    border: 1px solid rgba(100, 140, 255, 0.3);
    border-radius: 25px;
    padding: 8px 18px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 10;
  }
  #controls button {
    background: rgba(80, 120, 255, 0.25);
    border: 1px solid rgba(100, 140, 255, 0.5);
    color: #fff;
    border-radius: 18px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  #controls button:hover { background: rgba(80, 120, 255, 0.45); }
  #controls button.active { background: rgba(80, 180, 255, 0.5); border-color: #7df; }
  #controls label {
    font-size: 13px;
    color: #abc;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #controls input[type=range] {
    width: 80px;
    accent-color: #58f;
  }
  #hint {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(180, 200, 255, 0.6);
    pointer-events: none;
    z-index: 10;
  }
  #title-bar {
    position: absolute;
    top: 10px;
    left: 15px;
    z-index: 10;
  }
  #title-bar h1 {
    font-size: 16px;
    color: #7af;
    font-weight: 500;
  }
  #title-bar .sub {
    font-size: 11px;
    color: #678;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="title-bar">
  <h1>☀ Solar System Simulator</h1>
  <div class="sub">Click planets for info · Pinch/drag to zoom</div>
</div>

<div id="hint">Drag to pan · Scroll to zoom · Click a planet</div>

<div id="info-panel">
  <button class="close-btn" onclick="closePanel()">✕</button>
  <h2 id="planet-name"></h2>
  <p id="planet-desc"></p>
  <p><span class="stat" id="planet-dist"></span></p>
  <p><span class="stat" id="planet-diam"></span></p>
  <p><span class="stat" id="planet-orbit"></span></p>
  <p><span class="stat" id="planet-temp"></span></p>
  <p><span class="stat" id="planet-fun"></span></p>
</div>

<div id="controls">
  <button id="btn-slower" onclick="changeSpeed(-1)">⏪</button>
  <label>Speed: <span id="speed-label">1×</span></label>
  <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
  <button id="btn-faster" onclick="changeSpeed(1)">⏩</button>
  <button id="btn-pause" onclick="togglePause()">⏸ Pause</button>
  <button id="btn-orbits" class="active" onclick="toggleOrbits()">Orbits</button>
  <button id="btn-labels" class="active" onclick="toggleLabels()">Labels</button>
</div>

<script>
// === CANVAS SETUP ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// === STATE ===
let speed = 1;
let paused = false;
let showOrbits = true;
let showLabels = true;
let time = 0;

// Camera
let camX = 0, camY = 0, camZoom = 1;
let dragging = false, dragStartX, dragStartY, camStartX, camStartY;
let pinchDist = 0, pinchZoomStart = 1;

// === PLANET DATA ===
// distance in AU (scaled), radius relative, orbital period in Earth years
const planets = [
  {
    name: 'Mercury', dist: 0.39, radius: 3, period: 0.24, color: '#b5b5b5',
    desc: 'The smallest planet and closest to the Sun.',
    diam: '4,879 km', orbit: '88 days', temp: '−180°C to 430°C',
    fun: 'Mercury has no atmosphere, so it\'s silent out there!',
    glow: '#888'
  },
  {
    name: 'Venus', dist: 0.72, radius: 5, period: 0.62, color: '#e8c56d',
    desc: 'Hottest planet with thick toxic clouds.',
    diam: '12,104 km', orbit: '225 days', temp: '~465°C',
    fun: 'Venus spins backwards — the Sun rises in the west!',
    glow: '#da5'
  },
  {
    name: 'Earth', dist: 1.0, radius: 5.5, period: 1.0, color: '#4488cc',
    desc: 'Our home — the only known planet with life.',
    diam: '12,742 km', orbit: '365 days', temp: '−88°C to 58°C',
    fun: 'Earth is the only planet not named after a god.',
    glow: '#48f'
  },
  {
    name: 'Mars', dist: 1.52, radius: 4, period: 1.88, color: '#c1440e',
    desc: 'The Red Planet, a target for future exploration.',
    diam: '6,779 km', orbit: '687 days', temp: '−140°C to 20°C',
    fun: 'Mars has the tallest volcano in the solar system: Olympus Mons.',
    glow: '#c40'
  },
  {
    name: 'Jupiter', dist: 2.8, radius: 14, period: 11.86, color: '#c88b3a',
    desc: 'Largest planet — a gas giant with a massive storm.',
    diam: '139,820 km', orbit: '12 years', temp: '−110°C',
    fun: 'Jupiter\'s Great Red Spot is bigger than Earth!',
    glow: '#c85',
    bands: true
  },
  {
    name: 'Saturn', dist: 3.8, radius: 12, period: 29.46, color: '#e8d5a3',
    desc: 'Famous for its spectacular ring system.',
    diam: '116,460 km', orbit: '29 years', temp: '−140°C',
    fun: 'Saturn\'s rings are mostly ice and rock chunks.',
    glow: '#da5',
    rings: true
  },
  {
    name: 'Uranus', dist: 5.0, radius: 8, period: 84.01, color: '#7de0e0',
    desc: 'An ice giant that rotates on its side.',
    diam: '50,724 km', orbit: '84 years', temp: '−195°C',
    fun: 'Uranus spins nearly on its side — tilt of 98°!',
    glow: '#7ee',
    rings: true, ringColor: '#8ef'
  },
  {
    name: 'Neptune', dist: 6.2, radius: 7.5, period: 164.8, color: '#3355cc',
    desc: 'The windiest planet with supersonic storms.',
    diam: '49,244 km', orbit: '165 years', temp: '−200°C',
    fun: 'Neptune\'s winds reach 2,100 km/h — fastest in the solar system!',
    glow: '#35c'
  }
];

// Asteroid belt (decorative particles)
const asteroids = [];
for (let i = 0; i < 200; i++) {
  asteroids.push({
    dist: 2.1 + Math.random() * 0.6,
    angle: Math.random() * Math.PI * 2,
    speed: 0.3 + Math.random() * 0.4,
    size: 0.5 + Math.random() * 1.2,
    brightness: 0.3 + Math.random() * 0.4
  });
}

// Background stars
const stars = [];
for (let i = 0; i < 500; i++) {
  stars.push({
    x: (Math.random() - 0.5) * 8000,
    y: (Math.random() - 0.5) * 8000,
    size: Math.random() * 1.5 + 0.3,
    brightness: 0.4 + Math.random() * 0.6,
    twinkleSpeed: 0.5 + Math.random() * 2
  });
}

const DIST_SCALE = 90; // pixels per AU
const SUN_RADIUS = 22;

// === HELPERS ===
function hexToRgba(hex, alpha) {
  if (typeof hex !== 'string') return `rgba(0,0,0,${alpha})`;
  let r, g, b;
  if (hex.length === 4) {
    r = parseInt(hex[1]+hex[1], 16);
    g = parseInt(hex[2]+hex[2], 16);
    b = parseInt(hex[3]+hex[3], 16);
  } else if (hex.length === 7) {
    r = parseInt(hex.slice(1,3), 16);
    g = parseInt(hex.slice(3,5), 16);
    b = parseInt(hex.slice(5,7), 16);
  } else {
    r = g = b = 128;
  }
  return `rgba(${r},${g},${b},${alpha})`;
}

// === RENDERING ===
function worldToScreen(wx, wy) {
  return {
    x: (wx - camX) * camZoom + W / 2,
    y: (wy - camY) * camZoom + H / 2
  };
}

function drawStars() {
  if (!ctx || W <= 0 || H <= 0) return;
  for (const s of stars) {
    const sp = worldToScreen(s.x, s.y);
    if (sp.x < -10 || sp.x > W + 10 || sp.y < -10 || sp.y > H + 10) continue;
    const twinkle = 0.6 + 0.4 * Math.sin(time * s.twinkleSpeed);
    ctx.fillStyle = `rgba(220, 230, 255, ${s.brightness * twinkle})`;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, s.size * camZoom * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawSun() {
  if (!ctx || W <= 0 || H <= 0) return;
  const sp = worldToScreen(0, 0);
  const r = SUN_RADIUS * camZoom;

  // Outer glow
  const grd3 = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, r * 5);
  grd3.addColorStop(0, 'rgba(255, 200, 50, 0.15)');
  grd3.addColorStop(1, 'rgba(255, 100, 0, 0)');
  ctx.fillStyle = grd3;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r * 5, 0, Math.PI * 2);
  ctx.fill();

  // Medium glow
  const grd2 = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, r * 2.5);
  grd2.addColorStop(0, 'rgba(255, 220, 100, 0.4)');
  grd2.addColorStop(0.5, 'rgba(255, 150, 30, 0.15)');
  grd2.addColorStop(1, 'rgba(255, 80, 0, 0)');
  ctx.fillStyle = grd2;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r * 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Sun body
  const grd = ctx.createRadialGradient(sp.x - r * 0.2, sp.y - r * 0.2, 0, sp.x, sp.y, r);
  grd.addColorStop(0, '#fff8e0');
  grd.addColorStop(0.3, '#ffe44d');
  grd.addColorStop(0.7, '#ffaa00');
  grd.addColorStop(1, '#ff6600');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
  ctx.fill();

  // Corona pulses
  ctx.strokeStyle = `rgba(255, 200, 50, ${0.15 + 0.1 * Math.sin(time * 2)})`;
  ctx.lineWidth = 2 * camZoom;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r * (1.3 + 0.1 * Math.sin(time * 3)), 0, Math.PI * 2);
  ctx.stroke();
}

function drawOrbit(dist) {
  if (!ctx || W <= 0 || H <= 0) return;
  const sp = worldToScreen(0, 0);
  const r = dist * DIST_SCALE * camZoom;
  ctx.strokeStyle = 'rgba(60, 80, 140, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPlanet(planet, index) {
  const angle = (time / planet.period) * Math.PI * 2 * 0.1;
  const wx = Math.cos(angle) * planet.dist * DIST_SCALE;
  const wy = Math.sin(angle) * planet.dist * DIST_SCALE;
  const sp = worldToScreen(wx, wy);
  const r = Math.max(planet.radius * camZoom, 2);

  // Glow
  const glowR = r * 3;
  const grd = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, glowR);
  grd.addColorStop(0, hexToRgba(planet.glow, 0.25));
  grd.addColorStop(1, hexToRgba(planet.glow, 0.0));
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, glowR, 0, Math.PI * 2);
  ctx.fill();

  // Rings (behind planet)
  if (planet.rings) {
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(0.4);
    ctx.scale(1, 0.35);
    const ringColor = planet.ringColor || 'rgba(210, 190, 140, 0.6)';
    ctx.strokeStyle = ringColor;
    ctx.lineWidth = Math.max(r * 0.3, 1.5);
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = Math.max(r * 0.15, 1);
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Planet body
  const grd = ctx.createRadialGradient(sp.x - r * 0.3, sp.y - r * 0.3, 0, sp.x, sp.y, r);
  grd.addColorStop(0, lightenColor(planet.color, 40));
  grd.addColorStop(0.7, planet.color);
  grd.addColorStop(1, darkenColor(planet.color, 40));
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
  ctx.fill();

  // Jupiter bands
  if (planet.bands && r > 4) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
    ctx.clip();
    const bandColors = ['#a07030', '#c89050', '#a07030', '#d8a868'];
    for (let i = 0; i < 5; i++) {
      const by = sp.y - r + (i + 0.5) * (2 * r / 5);
      ctx.fillStyle = bandColors[i % bandColors.length] + '80';
      ctx.fillRect(sp.x - r, by - r * 0.12, r * 2, r * 0.24);
    }
    ctx.restore();
  }

  // Earth's moon
  if (planet.name === 'Earth') {
    const moonAngle = time * 4;
    const moonDist = r * 2.5;
    const mx = sp.x + Math.cos(moonAngle) * moonDist;
    const my = sp.y + Math.sin(moonAngle) * moonDist;
    const mr = Math.max(r * 0.25, 1.2);
    ctx.fillStyle = '#ccc';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
  }

  // Label
  if (showLabels && camZoom > 0.3) {
    ctx.fillStyle = 'rgba(200, 220, 255, 0.8)';
    ctx.font = `${Math.max(10, 12 * camZoom)}px 'Segoe UI', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(planet.name, sp.x, sp.y - r - 6 * camZoom);
  }

  // Store screen position for hit testing
  planet._sx = sp.x;
  planet._sy = sp.y;
  planet._sr = Math.max(r, 10);
  planet._wx = wx;
  planet._wy = wy;
}

function drawAsteroids() {
  if (!ctx || W <= 0 || H <= 0) return;
  for (const a of asteroids) {
    const angle = a.angle + time * a.speed * 0.01;
    const wx = Math.cos(angle) * a.dist * DIST_SCALE;
    const wy = Math.sin(angle) * a.dist * DIST_SCALE;
    const sp = worldToScreen(wx, wy);
    if (sp.x < -5 || sp.x > W + 5 || sp.y < -5 || sp.y > H + 5) continue;
    ctx.fillStyle = `rgba(160, 150, 130, ${a.brightness})`;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, a.size * camZoom * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function lightenColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
  return `rgb(${r},${g},${b})`;
}

// === HIT TESTING ===
let selectedPlanet = null;

function getPlanetAt(px, py) {
  for (let i = planets.length - 1; i >= 0; i--) {
    const p = planets[i];
    if (!p._sx) continue;
    const dx = px - p._sx, dy = py - p._sy;
    if (dx * dx + dy * dy <= p._sr * p._sr) return p;
  }
  // Check sun
  const sunS = worldToScreen(0, 0);
  const dx = px - sunS.x, dy = py - sunS.y;
  const sunR = SUN_RADIUS * camZoom;
  if (dx * dx + dy * dy <= sunR * sunR) return {
    name: 'The Sun ☀',
    desc: 'Our star — a giant sphere of hot plasma.',
    diam: '1,391,000 km', orbit: 'N/A',
    temp: '~5,500°C surface',
    fun: 'The Sun contains 99.86% of the solar system\'s mass!'
  };
  return null;
}

// === INFO PANEL ===
function showPanel(p) {
  const panel = document.getElementById('info-panel');
  document.getElementById('planet-name').textContent = p.name;
  document.getElementById('planet-desc').textContent = p.desc;
  document.getElementById('planet-dist').textContent = 'Distance from Sun: ' + p.dist + ' AU';
  document.getElementById('planet-diam').textContent = 'Diameter: ' + p.diam;
  document.getElementById('planet-orbit').textContent = 'Orbital Period: ' + p.orbit;
  document.getElementById('planet-temp').textContent = 'Temperature: ' + p.temp;
  document.getElementById('planet-fun').textContent = '💡 ' + p.fun;
  panel.style.display = 'block';
}

function closePanel() {
  document.getElementById('info-panel').style.display = 'none';
  selectedPlanet = null;
}

// === CONTROLS ===
function changeSpeed(delta) {
  speed = Math.max(0.1, Math.min(10, speed + delta * 0.5));
  document.getElementById('speed-slider').value = speed;
  updateSpeedLabel();
}

function togglePause() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Play' : '⏸ Pause';
  document.getElementById('btn-pause').classList.toggle('active', paused);
}

function toggleOrbits() {
  showOrbits = !showOrbits;
  document.getElementById('btn-orbits').classList.toggle('active', showOrbits);
}

function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-labels').classList.toggle('active', showLabels);
}

function updateSpeedLabel() {
  document.getElementById('speed-label').textContent = speed.toFixed(1) + '×';
}

document.getElementById('speed-slider').addEventListener('input', function() {
  speed = parseFloat(this.value);
  updateSpeedLabel();
});

// === INPUT HANDLING ===
// Mouse
canvas.addEventListener('mousedown', e => {
  dragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  camStartX = camX;
  camStartY = camY;
});

canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  camX = camStartX - (e.clientX - dragStartX) / camZoom;
  camY = camStartY - (e.clientY - dragStartY) / camZoom;
});

canvas.addEventListener('mouseup', e => {
  const moved = Math.abs(e.clientX - dragStartX) + Math.abs(e.clientY - dragStartY);
  if (moved < 5) {
    // Click
    const hit = getPlanetAt(e.clientX, e.clientY);
    if (hit) {
      showPanel(hit);
      selectedPlanet = hit;
    } else {
      closePanel();
    }
  }
  dragging = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.1, Math.min(10, camZoom * zoomFactor));

  // Zoom toward cursor
  const worldX = (e.clientX - W / 2) / camZoom + camX;
  const worldY = (e.clientY - H / 2) / camZoom + camY;

  camZoom = newZoom;
  camX = (e.clientX - W / 2) / camZoom - worldX;
  camY = (e.clientY - H / 2) / camZoom - worldY;
}, { passive: false });

// Touch
let touches = {};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const t = e.touches[0];
    dragging = true;
    dragStartX = t.clientX;
    dragStartY = t.clientY;
    camStartX = camX;
    camStartY = camY;
  } else if (e.touches.length === 2) {
    dragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.sqrt(dx * dx + dy * dy);
    pinchZoomStart = camZoom;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    const t = e.touches[0];
    camX = camStartX - (t.clientX - dragStartX) / camZoom;
    camY = camStartY - (t.clientY - dragStartY) / camZoom;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const scale = dist / pinchDist;
    camZoom = Math.max(0.1, Math.min(10, pinchZoomStart * scale));
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (e.touches.length === 0 && dragging) {
    const moved = Math.abs(dragStartX - (e.changedTouches[0]?.clientX || dragStartX)) +
                  Math.abs(dragStartY - (e.changedTouches[0]?.clientY || dragStartY));
    if (moved < 10 && e.changedTouches?.[0]) {
      const hit = getPlanetAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      if (hit) {
        showPanel(hit);
        selectedPlanet = hit;
      } else {
        closePanel();
      }
    }
  }
  dragging = false;
});

// Hide hint after first interaction
let hintVisible = true;
canvas.addEventListener('mousedown', hideHint, { once: true });
canvas.addEventListener('touchstart', hideHint, { once: true });
function hideHint() {
  if (hintVisible) {
    document.getElementById('hint').style.display = 'none';
    hintVisible = false;
  }
}

// === MAIN LOOP ===
function loop() {
  if (!ctx || !W || !H) return;
  try {
    if (!paused) {
      time += 0.016 * speed;
    }

    // Clear
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, W, H);

    // Stars
    drawStars();

    // Orbits
    if (showOrbits) {
      for (const p of planets) {
        drawOrbit(p.dist);
      }
    }

    // Asteroids
    drawAsteroids();

    // Sun
    drawSun();

    // Planets
    for (let i = 0; i < planets.length; i++) {
      drawPlanet(planets[i], i);
    }

    // Selected planet highlight
    if (selectedPlanet && selectedPlanet._sx) {
      ctx.strokeStyle = 'rgba(255, 255, 100, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(selectedPlanet._sx, selectedPlanet._sy, selectedPlanet._sr + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  } catch (err) {
    console.error('Rendering error:', err);
  }
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
