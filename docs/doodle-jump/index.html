<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Doodle Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; touch-action: none; }
canvas { display: block; margin: 0 auto; }
#ui-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; z-index: 10;
}
#ui-overlay.active { pointer-events: auto; }
#start-screen, #game-over-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px;
}
h1 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 2.5em; color: #7fff7f; text-shadow: 2px 2px 0 #004400, 4px 4px 0 rgba(0,0,0,0.3); margin-bottom: 10px; }
h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 2em; color: #ff7f7f; text-shadow: 2px 2px 0 #440000; margin-bottom: 10px; }
p { font-family: 'Segoe UI', Arial, sans-serif; color: #ddd; font-size: 1.1em; margin: 5px 0; }
.score-display { font-family: 'Segoe UI', Arial, sans-serif; font-size: 1.8em; color: #ffff7f; text-shadow: 1px 1px 0 #444400; margin: 10px 0; }
button {
  font-family: 'Segoe UI', Arial, sans-serif; font-size: 1.3em; padding: 12px 40px;
  margin-top: 20px; border: none; border-radius: 12px; cursor: pointer;
  background: linear-gradient(180deg, #5f5, #3a3); color: #111;
  box-shadow: 0 4px 0 #262, 0 6px 10px rgba(0,0,0,0.3);
  transition: transform 0.1s, box-shadow 0.1s;
}
button:active { transform: translateY(2px); box-shadow: 0 2px 0 #262, 0 3px 5px rgba(0,0,0,0.3); }
#hud {
  position: absolute; top: 10px; left: 10px; z-index: 5;
  font-family: 'Segoe UI', Arial, sans-serif; color: #fff; font-size: 1.2em;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8); pointer-events: none;
}
#mobile-controls {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 35%;
  display: none; z-index: 5; pointer-events: none;
}
.ctrl-half { width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
.ctrl-half:active { background: rgba(255,255,255,0.05); }
.ctrl-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 2em; color: rgba(255,255,255,0.15); user-select: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span id="hud-score">0</span>
</div>
<div id="ui-overlay" class="active">
  <div id="start-screen">
    <h1>🐸 Doodle Jump</h1>
    <p>Jump on platforms to climb higher!</p>
    <p>← → or Touch to move</p>
    <p>Avoid gaps and red springs!</p>
    <button id="btn-start">PLAY</button>
  </div>
  <div id="game-over-screen" style="display:none;">
    <h2>GAME OVER</h2>
    <div class="score-display">Score: <span id="final-score">0</span></div>
    <p>Best: <span id="best-score">0</span></p>
    <button id="btn-restart">PLAY AGAIN</button>
  </div>
</div>
<div id="mobile-controls">
  <div class="ctrl-half" id="ctrl-left"><span class="ctrl-label">◀</span></div>
  <div class="ctrl-half" id="ctrl-right"><span class="ctrl-label">▶</span></div>
</div>

<script>
// --- Setup ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('ui-overlay');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const hudScore = document.getElementById('hud-score');
const finalScoreEl = document.getElementById('final-score');
const bestScoreEl = document.getElementById('best-score');
const mobileCtrl = document.getElementById('mobile-controls');
let isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || ('ontouchstart' in window);
if (isMobile) mobileCtrl.style.display = 'flex';

let W, H;
function resize() {
  const maxW = 480, maxH = 720;
  const ratio = maxW / maxH;
  if (window.innerWidth / window.innerHeight < ratio) { W = window.innerWidth; H = window.innerWidth / ratio; }
  else { H = window.innerHeight; W = window.innerHeight * ratio; }
  canvas.width = W; canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// --- Game Constants ---
const GRAVITY = 0.45;
const JUMP_FORCE = -11;
const SPRING_FORCE = -18;
const MOVE_SPEED = 5.5;
const PLAT_W = 70, PLAT_H = 14;
const PLAYER_W = 40, PLAYER_H = 40;
const PLATFORM_TYPES = {
  normal: { color: '#6b6', w: PLAT_W, score: 1 },
  move: { color: '#6bf', w: PLAT_W, moveSpeed: 2, score: 2 },
  fragile: { color: '#c84', w: PLAT_W, score: 2 },
  spring: { color: '#f55', w: 30, score: 1, spring: true },
  vine: { color: '#b6f', w: 20, score: 3 },
};

// --- Game State ---
let player, platforms, score, highScore, camera, gameOver, animId, particles;
highScore = parseInt(localStorage.getItem('doodlejump_best') || '0');

function init() {
  player = { x: W / 2 - PLAYER_W / 2, y: H - 100, vx: 0, vy: 0, dir: 1, w: PLAYER_W, h: PLAYER_H };
  platforms = [];
  score = 0;
  gameOver = false;
  particles = [];
  camera = 0;

  // Starting platform under player
  platforms.push({ type: 'normal', x: W / 2 - PLAT_W / 2, y: H - 50, w: PLAT_W * 2, h: PLAT_H, broken: false });

  // Generate initial platforms
  let y = H - 130;
  while (y > -200) {
    platforms.push(genPlatform(y));
    y -= 70 + Math.random() * 40;
  }
}

function genPlatform(y) {
  const r = Math.random();
  let type = 'normal';
  if (score > 5000) {
    if (r < 0.15) type = 'vine';
    else if (r < 0.3) type = 'spring';
    else if (r < 0.5) type = 'fragile';
    else if (r < 0.7) type = 'move';
  } else if (score > 2000) {
    if (r < 0.15) type = 'spring';
    else if (r < 0.3) type = 'fragile';
    else if (r < 0.5) type = 'move';
  } else if (r < 0.3) {
    type = 'move';
  } else if (r < 0.45) {
    type = 'fragile';
  } else if (r < 0.55) {
    type = 'spring';
  }

  const def = PLATFORM_TYPES[type];
  return { type, x: Math.random() * (W - def.w), y, w: def.w, h: PLAT_H, broken: false, moveSpeed: def.moveSpeed || 0, moveDir: Math.random() < 0.5 ? 1 : -1 };
}

// --- Particles ---
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6 - 2, life: 30 + Math.random() * 20, color });
  }
}

// --- Input ---
let keys = { left: false, right: false };
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true; });
document.addEventListener('keyup', e => { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; });

// Mobile touch
const ctrlLeft = document.getElementById('ctrl-left');
const ctrlRight = document.getElementById('ctrl-right');
ctrlLeft.addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
ctrlLeft.addEventListener('touchend', e => { e.preventDefault(); keys.left = false; });
ctrlRight.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
ctrlRight.addEventListener('touchend', e => { e.preventDefault(); keys.right = false; });

// --- Buttons ---
function startGame() {
  overlay.classList.remove('active');
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  init();
  if (animId) cancelAnimationFrame(animId);
  loop();
}
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

function endGame() {
  gameOver = true;
  if (score > highScore) { highScore = score; localStorage.setItem('doodlejump_best', highScore); }
  setTimeout(() => {
    overlay.classList.add('active');
    gameOverScreen.style.display = 'flex';
    startScreen.style.display = 'none';
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = highScore;
  }, 500);
}

// --- Update ---
function update() {
  if (gameOver) return;

  // Horizontal movement
  if (keys.left) { player.vx = -MOVE_SPEED; player.dir = -1; }
  else if (keys.right) { player.vx = MOVE_SPEED; player.dir = 1; }
  else player.vx *= 0.8;

  player.x += player.vx;
  // Wrap around
  if (player.x + player.w < 0) player.x = W;
  if (player.x > W) player.x = -player.w;

  // Gravity
  player.vy += GRAVITY;
  player.y += player.vy;

  // Camera follows upward
  const targetCam = player.y - H * 0.4;
  if (targetCam < camera) {
    camera = targetCam;
  }

  // Platform collision (only when falling)
  if (player.vy >= 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      const feet = player.y + player.h;
      const prevFeet = feet - player.vy;
      if (player.x + player.w > p.x && player.x < p.x + p.w &&
          feet >= p.y && prevFeet <= p.y + 8) {
        player.y = p.y - player.h;
        if (p.type === 'spring') {
          player.vy = SPRING_FORCE;
          spawnParticles(player.x + player.w / 2, p.y, '#ff0', 8);
        } else if (p.type === 'fragile') {
          p.broken = true;
          player.vy = JUMP_FORCE;
          spawnParticles(p.x + p.w / 2, p.y, p.color, 10);
        } else if (p.type === 'vine') {
          player.vy = JUMP_FORCE * 1.3;
          spawnParticles(player.x + player.w / 2, p.y, '#f0f', 6);
        } else {
          player.vy = JUMP_FORCE;
          spawnParticles(player.x + player.w / 2, p.y, '#fff', 3);
        }
        break;
      }
    }
  }

  // Move platforms
  for (const p of platforms) {
    if (p.type === 'move' && !p.broken) {
      p.x += p.moveSpeed * p.moveDir;
      if (p.x <= 0 || p.x + p.w >= W) p.moveDir *= -1;
    }
  }

  // Score
  const newScore = Math.max(0, Math.floor(-camera / 5));
  score = Math.max(score, newScore);
  hudScore.textContent = score;

  // Generate new platforms above
  const highestPlat = Math.min(...platforms.map(p => p.y));
  while (highestPlat > camera - H) {
    const np = genPlatform(highestPlat - 70 - Math.random() * 40);
    platforms.push(np);
  }

  // Remove off-screen platforms
  platforms = platforms.filter(p => p.y < camera + H + 100);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Game over if fallen off
  if (player.y > camera + H + 100) {
    endGame();
  }
}

// --- Draw ---
function draw() {
  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  const darkness = Math.min(0.7, score / 20000);
  grad.addColorStop(0, `rgb(${20 + darkness * 30}, ${20 + darkness * 20}, ${50 + darkness * 20})`);
  grad.addColorStop(1, `rgb(${30 + darkness * 40}, ${40 + darkness * 20}, ${60 + darkness * 20})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  const offY = -camera % gridSize;
  for (let y = offY; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  ctx.save();
  ctx.translate(0, -camera);

  // Platforms
  for (const p of platforms) {
    if (p.broken) continue;
    if (p.y < camera - 50 || p.y > camera + H + 50) continue;
    ctx.fillStyle = p.color;
    // Rounded rect
    const r = 4;
    ctx.beginPath();
    ctx.moveTo(p.x + r, p.y);
    ctx.lineTo(p.x + p.w - r, p.y);
    ctx.quadraticCurveTo(p.x + p.w, p.y, p.x + p.w, p.y + r);
    ctx.lineTo(p.x + p.w, p.y + p.h - r);
    ctx.quadraticCurveTo(p.x + p.w, p.y + p.h, p.x + p.w - r, p.y + p.h);
    ctx.lineTo(p.x + r, p.y + p.h);
    ctx.quadraticCurveTo(p.x, p.y + p.h, p.x, p.y + p.h - r);
    ctx.lineTo(p.x, p.y + r);
    ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y);
    ctx.fill();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(p.x + 3, p.y + 2, p.w - 6, 3);
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Player
  drawPlayer();

  ctx.restore();
}

function drawPlayer() {
  const px = player.x, py = player.y;
  const dir = player.dir;

  // Body
  ctx.fillStyle = '#6d3';
  ctx.beginPath();
  ctx.ellipse(px + player.w / 2, py + player.h * 0.55, player.w * 0.38, player.h * 0.38, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4a2'; ctx.lineWidth = 2; ctx.stroke();

  // Belly
  ctx.fillStyle = '#9f6';
  ctx.beginPath();
  ctx.ellipse(px + player.w / 2, py + player.h * 0.6, player.w * 0.22, player.h * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  const eyeX = px + player.w / 2 + dir * 6;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(eyeX - 5, py + 10, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(eyeX + 5, py + 10, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(eyeX - 5 + dir * 2, py + 10, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(eyeX + 5 + dir * 2, py + 10, 3, 0, Math.PI * 2); ctx.fill();

  // Legs
  const legBend = Math.sin(Date.now() / 80) * 3;
  ctx.strokeStyle = '#6d3'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  // Back legs
  ctx.beginPath(); ctx.moveTo(px + 8, py + player.h - 8);
  ctx.quadraticCurveTo(px - 4, py + player.h + 4 + legBend, px - 2, py + player.h + 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px + player.w - 8, py + player.h - 8);
  ctx.quadraticCurveTo(px + player.w + 4, py + player.h + 4 - legBend, px + player.w + 2, py + player.h + 6); ctx.stroke();
  // Feet
  ctx.fillStyle = '#4a2';
  ctx.beginPath(); ctx.ellipse(px - 2, py + player.h + 8, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px + player.w + 2, py + player.h + 8, 5, 3, 0, 0, Math.PI * 2); ctx.fill();

  // Nose/snout
  ctx.fillStyle = '#8b4';
  ctx.beginPath();
  ctx.ellipse(eyeX + dir * 10, py + 16, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();
}

// --- Loop ---
function loop() {
  update();
  draw();
  if (!gameOver) animId = requestAnimationFrame(loop);
}

// --- Idle draw ---
function idleDraw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  // Draw a little frog
  const t = Date.now() / 1000;
  ctx.save();
  ctx.translate(W / 2, H / 2 + Math.sin(t * 2) * 10);
  ctx.fillStyle = '#6d3';
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-10, -8, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -8, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-9, -8, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(11, -8, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  requestAnimationFrame(idleDraw);
}
idleDraw();
</script>
</body>
</html>
