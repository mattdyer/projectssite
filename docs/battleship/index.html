<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battleship</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0a1628;
  color: #e0e8f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
h1 {
  margin-top: 16px;
  font-size: 1.6rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(90deg, #4fc3f7, #0288d1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#status {
  margin: 8px 0 12px;
  font-size: 1rem;
  text-align: center;
  min-height: 1.4em;
  color: #90caf9;
}
.grids {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  padding: 0 8px;
}
.board-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.board-container h2 {
  font-size: 0.9rem;
  margin-bottom: 6px;
  color: #78909c;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.board {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 1px;
  background: #1a2a44;
  border: 2px solid #263854;
  border-radius: 4px;
  overflow: hidden;
  touch-action: manipulation;
}
.cell {
  width: 32px;
  height: 32px;
  background: #0d1f3c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
  -webkit-user-select: none;
}
.cell:hover { background: #1a3358; }
.cell.ship { background: #37474f; }
.cell.hit {
  background: #b71c1c;
  animation: pop 0.3s ease;
}
.cell.miss {
  background: #1a2a44;
}
.cell.miss::after {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #546e7a;
}
.cell.sunk {
  background: #7f0000;
  border: 1px solid #ff5252;
}
.cell.preview {
  background: #1b5e20;
  opacity: 0.7;
}
.cell.preview-invalid {
  background: #b71c1c;
  opacity: 0.7;
}
@keyframes pop {
  0% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
#controls {
  margin: 14px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 0 8px;
}
button {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s, background 0.2s;
  touch-action: manipulation;
}
button:active { transform: scale(0.96); }
.btn-primary { background: #1565c0; color: #fff; }
.btn-primary:hover { background: #1976d2; }
.btn-secondary { background: #37474f; color: #e0e8f0; }
.btn-secondary:hover { background: #455a64; }
.btn-danger { background: #c62828; color: #fff; }
.btn-danger:hover { background: #d32f2f; }
.btn-success { background: #2e7d32; color: #fff; }
.btn-success:hover { background: #388e3c; }
#ships-info {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 8px 0;
  padding: 0 8px;
  max-width: 640px;
}
.ship-status {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  background: #1a2a44;
  border: 1px solid #263854;
}
.ship-status.sunk {
  background: #7f0000;
  border-color: #ff5252;
  text-decoration: line-through;
}
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,22,40,0.85);
  z-index: 100;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 16px;
}
#overlay.show { display: flex; }
#overlay h2 {
  font-size: 2rem;
  background: linear-gradient(90deg, #4fc3f7, #0288d1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#overlay p { font-size: 1.1rem; color: #90caf9; }
#overlay button { font-size: 1.1rem; padding: 12px 32px; }

@media (max-width: 500px) {
  .cell { width: 28px; height: 28px; font-size: 12px; }
  h1 { font-size: 1.3rem; }
  .grids { gap: 12px; }
}
@media (max-width: 380px) {
  .cell { width: 24px; height: 24px; font-size: 11px; }
}
</style>
</head>
<body>

<h1>⚓ Battleship</h1>
<div id="status">Place your ships</div>
<div id="ships-info"></div>
<div class="grids">
  <div class="board-container">
    <h2>Your Fleet</h2>
    <div class="board" id="player-board"></div>
  </div>
  <div class="board-container">
    <h2>Enemy Waters</h2>
    <div class="board" id="enemy-board"></div>
  </div>
</div>
<div id="controls">
  <button class="btn-success" id="btn-rotate" title="Rotate placement direction">Rotate: ↕</button>
  <button class="btn-primary" id="btn-random" >Random</button>
  <button class="btn-secondary" id="btn-clear">Clear</button>
  <button class="btn-danger" id="btn-start" style="display:none">Start Battle!</button>
</div>

<div id="overlay">
  <h2 id="overlay-title"></h2>
  <p id="overlay-msg"></p>
  <button class="btn-primary" id="btn-restart">Play Again</button>
</div>

<script>
const BOARD_SIZE = 10;
const SHIPS = [
  { name: 'Carrier', size: 5 },
  { name: 'Battleship', size: 4 },
  { name: 'Cruiser', size: 3 },
  { name: 'Submarine', size: 3 },
  { name: 'Destroyer', size: 2 }
];

let horizontal = true;
let playerShips = [];
let computerShips = [];
let playerBoard = [];
let computerBoard = [];
let phase = 'placement'; // placement, playing, over
let playerTurn = true;
let playerShipsSunk = 0;
let computerShipsSunk = 0;
let computerHits = []; // AI memory
let computerMisses = [];
let computerTargetMode = false;

function init() {
  playerBoard = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0)); // 0=empty, 1=ship
  computerBoard = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
  playerShips = SHIPS.map(s => ({ ...s, hits: 0, sunk: false }));
  computerShips = SHIPS.map(s => ({ ...s, hits: 0, sunk: false, placed: false }));
  playerShipsSunk = 0;
  computerShipsSunk = 0;
  computerHits = [];
  computerMisses = [];
  computerTargetMode = false;
  phase = 'placement';
  playerTurn = true;
  buildBoard('player-board', 'player');
  buildBoard('enemy-board', 'enemy');
  updateStatus('Place your ships: click to place. Drag to paint.');
  updateShipsInfo();
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-rotate').textContent = 'Rotate: ' + (horizontal ? '↕' : '↔');
  document.getElementById('overlay').classList.remove('show');
}

function buildBoard(id, owner) {
  const board = document.getElementById(id);
  board.innerHTML = '';
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.dataset.owner = owner;
      board.appendChild(cell);
      if (owner === 'player') {
        cell.addEventListener('mouseenter', () => previewPlacement(r, c));
        cell.addEventListener('mouseleave', clearPreview);
        cell.addEventListener('mousedown', (e) => { e.preventDefault(); placeShip(r, c, true); });
        cell.addEventListener('touchstart', (e) => { e.preventDefault(); placeShip(r, c, true); });
      } else {
        cell.addEventListener('click', () => fireAt(r, c));
        cell.addEventListener('touchend', (e) => { e.preventDefault(); fireAt(r, c); });
      }
    }
  }
  // Drag for player board
  let dragging = false;
  board.addEventListener('mousedown', () => { dragging = true; });
  board.addEventListener('touchstart', (e) => { e.preventDefault(); dragging = true; }, { passive: false });
  board.addEventListener('mouseup', () => { dragging = false; });
  board.addEventListener('mouseleave', () => { dragging = false; });
  board.addEventListener('touchend', () => { dragging = false; });
  board.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const rect = board.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const cw = rect.width / BOARD_SIZE;
    const ch = rect.height / BOARD_SIZE;
    const c = Math.min(BOARD_SIZE - 1, Math.max(0, Math.floor(x / cw)));
    const r = Math.min(BOARD_SIZE - 1, Math.max(0, Math.floor(y / ch)));
    placeShip(r, c, true);
  });
  board.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = board.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    const cw = rect.width / BOARD_SIZE;
    const ch = rect.height / BOARD_SIZE;
    const c = Math.min(BOARD_SIZE - 1, Math.max(0, Math.floor(x / cw)));
    const r = Math.min(BOARD_SIZE - 1, Math.max(0, Math.floor(y / ch)));
    placeShip(r, c, true);
  }, { passive: false });
}

function getShipCells(r, c, size, horiz) {
  const cells = [];
  for (let i = 0; i < size; i++) {
    cells.push(horiz ? { r, c: c + i } : { r: r + i, c });
  }
  return cells;
}

function canPlace(board, r, c, size, horiz) {
  for (let i = 0; i < size; i++) {
    const cr = horiz ? r : r + i;
    const cc = horiz ? c + i : c;
    if (cr < 0 || cr >= BOARD_SIZE || cc < 0 || cc >= BOARD_SIZE) return false;
    if (board[cr][cc] === 1) return false;
  }
  return true;
}

function previewPlacement(r, c) {
  if (phase !== 'placement') return;
  clearPreview();
  const cells = getShipCells(r, c, getNextShipSize(), horizontal);
  const valid = canPlace(playerBoard, r, c, getNextShipSize(), horizontal);
  cells.forEach(cell => {
    const el = getPlayerCell(cell.r, cell.c);
    if (el) el.classList.add(valid ? 'preview' : 'preview-invalid');
  });
}

function clearPreview() {
  document.querySelectorAll('#player-board .preview, #player-board .preview-invalid').forEach(el => {
    el.classList.remove('preview', 'preview-invalid');
  });
}

function getNextShipIdx() {
  for (let i = 0; i < playerShips.length; i++) {
    if (!playerShips[i].placed) return i;
  }
  return -1;
}

function getNextShipSize() {
  const idx = getNextShipIdx();
  return idx >= 0 ? SHIPS[idx].size : 0;
}

function placeShip(r, c, drag) {
  if (phase !== 'placement') return;
  const idx = getNextShipIdx();
  if (idx < 0) return;
  const size = SHIPS[idx].size;
  const cells = getShipCells(r, c, size, horizontal);
  if (!canPlace(playerBoard, r, c, size, horizontal)) {
    if (!drag) return; // allow drag-through
  }
  cells.forEach(cell => {
    if (canPlace(playerBoard, r, c, size, horizontal) || playerBoard[cell.r][cell.c] === 1) {
      playerBoard[cell.r][cell.c] = 1;
    }
  });
  playerShips[idx].placed = true;
  renderPlayerBoard();
  checkPlacementComplete();
}

function renderPlayerBoard() {
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const el = getPlayerCell(r, c);
      el.className = 'cell';
      if (playerBoard[r][c] === 1) el.classList.add('ship');
      // Mark sunk ships
      playerShips.forEach(ship => {
        if (ship.sunk) {
          for (let i = 0; i < ship._cells.length; i++) {
            if (ship._cells[i] && ship._cells[i].r === r && ship._cells[i].c === c) {
              el.className = 'cell sunk';
            }
          }
        }
      });
    }
  }
}

function getPlayerCell(r, c) {
  return document.querySelector(`#player-board .cell[data-r="${r}"][data-c="${c}"]`);
}

function getEnemyCell(r, c) {
  return document.querySelector(`#enemy-board .cell[data-r="${r}"][data-c="${c}"]`);
}

function checkPlacementComplete() {
  const allPlaced = playerShips.every(s => s.placed);
  if (allPlaced) {
    updateStatus('All ships placed! Press Start Battle!');
    document.getElementById('btn-start').style.display = 'inline-block';
  }
}

function placeComputerShips() {
  computerShips.forEach(ship => {
    let placed = false;
    while (!placed) {
      const horiz = Math.random() < 0.5;
      const r = Math.floor(Math.random() * BOARD_SIZE);
      const c = Math.floor(Math.random() * BOARD_SIZE);
      if (canPlace(computerBoard, r, c, ship.size, horiz)) {
        const cells = getShipCells(r, c, ship.size, horiz);
        ship._cells = cells;
        cells.forEach(cell => { computerBoard[cell.r][cell.c] = 1; });
        ship.placed = true;
        placed = true;
      }
    }
  });
}

function randomizePlayerShips() {
  // Reset
  playerBoard = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
  playerShips.forEach(s => { s.placed = false; s.hits = 0; s.sunk = false; s._cells = null; });
  playerShipsSunk = 0;

  playerShips.forEach(ship => {
    let placed = false;
    while (!placed) {
      const horiz = Math.random() < 0.5;
      const r = Math.floor(Math.random() * BOARD_SIZE);
      const c = Math.floor(Math.random() * BOARD_SIZE);
      if (canPlace(playerBoard, r, c, ship.size, horiz)) {
        const cells = getShipCells(r, c, ship.size, horiz);
        ship._cells = cells;
        cells.forEach(cell => { playerBoard[cell.r][cell.c] = 1; });
        ship.placed = true;
        placed = true;
      }
    }
  });

  renderPlayerBoard();
  updateShipsInfo();
  checkPlacementComplete();
}

function clearPlayerShips() {
  playerBoard = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
  playerShips.forEach(s => { s.placed = false; s.hits = 0; s.sunk = false; s._cells = null; });
  playerShipsSunk = 0;
  renderPlayerBoard();
  updateShipsInfo();
  updateStatus('Place your ships');
  document.getElementById('btn-start').style.display = 'none';
}

function startGame() {
  if (!playerShips.every(s => s.placed)) return;
  placeComputerShips();
  phase = 'playing';
  updateStatus('Your turn — click on Enemy Waters to fire!');
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-rotate').style.display = 'none';
  document.getElementById('btn-random').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
}

function fireAt(r, c) {
  if (phase !== 'playing' || !playerTurn) return;
  const cell = getEnemyCell(r, c);
  if (!cell || (cell.classList.contains('hit') || cell.classList.contains('miss') || cell.classList.contains('sunk'))) return;

  let result = 'miss';
  if (computerBoard[r][c] === 1) {
    result = 'hit';
    // Find which ship was hit
    computerShips.forEach(ship => {
      if (!ship.sunk && ship._cells) {
        ship._cells.forEach(sc => {
          if (sc.r === r && sc.c === c) {
            ship.hits++;
            if (ship.hits >= ship.size) {
              ship.sunk = true;
              playerShipsSunk++;
              // Mark all cells of this ship as sunk on enemy board
              ship._cells.forEach(sc => {
                const el = getEnemyCell(sc.r, sc.c);
                if (el) { el.className = 'cell sunk'; }
              });
              updateStatus(`You sunk the enemy's ${ship.name}! (${5 - playerShipsSunk} remaining)`);
              checkWinCondition();
            } else {
              updateStatus('Hit!');
            }
          }
        });
      }
    });
    cell.className = 'cell hit';
    cell.textContent = '✕';
  } else {
    cell.className = 'cell miss';
    updateStatus('Miss!');
    playerTurn = false;
    setTimeout(computerTurn, 600);
  }
  updateShipsInfo();
}

function computerTurn() {
  if (phase !== 'playing') return;

  let r, c;

  // AI: target mode if we have hits
  if (computerHits.length > 0 && !computerTargetMode) {
    // Check if target mode ships still have cells to try
    const remaining = computerHits.filter(hr => !computerMisses.some(cm => cm.r === hr.r && cm.c === hr.c) &&
      !isComputerHit(hr.r, hr.c) && !isComputerMiss(hr.r, hr.c));
    if (remaining.length === 0) {
      computerTargetMode = false;
      computerHits = [];
    }
  }

  if (computerTargetMode && computerHits.length > 0) {
    // Try adjacent cells to last hit
    const lastHit = computerHits[computerHits.length - 1];
    const neighbors = [
      { r: lastHit.r - 1, c: lastHit.c },
      { r: lastHit.r + 1, c: lastHit.c },
      { r: lastHit.r, c: lastHit.c - 1 },
      { r: lastHit.r, c: lastHit.c + 1 }
    ].filter(n => n.r >= 0 && n.r < BOARD_SIZE && n.c >= 0 && n.c < BOARD_SIZE &&
      !isComputerHit(n.r, n.c) && !isComputerMiss(n.r, n.c));

    if (neighbors.length > 0) {
      const chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
      r = chosen.r;
      c = chosen.c;
    } else {
      computerTargetMode = false;
      // Fallback: pick random
      do {
        r = Math.floor(Math.random() * BOARD_SIZE);
        c = Math.floor(Math.random() * BOARD_SIZE);
      } while (isComputerHit(r, c) || isComputerMiss(r, c));
    }
  } else {
    // Random with checkerboard bias
    do {
      r = Math.floor(Math.random() * BOARD_SIZE);
      c = Math.floor(Math.random() * BOARD_SIZE);
    } while (isComputerHit(r, c) || isComputerMiss(r, c));
  }

  // Mark
  if (playerBoard[r][c] === 1) {
    isComputerHit(r, c, true);
    computerHits.push({ r, c });

    // Check if a ship sunk
    let sunkShip = null;
    playerShips.forEach(ship => {
      if (!ship.sunk && ship._cells) {
        ship._cells.forEach(sc => {
          if (sc.r === r && sc.c === c) {
            ship.hits++;
            if (ship.hits >= ship.size) {
              ship.sunk = true;
              computerShipsSunk++;
              sunkShip = ship;
              // Remove these cells from target mode
              computerHits = computerHits.filter(h => !ship._cells.some(sc => sc.r === h.r && sc.c === h.c));
              if (computerHits.length === 0) computerTargetMode = false;
            }
          }
        });
      }
    });

    const cell = getPlayerCell(r, c);
    cell.className = 'cell hit';
    cell.textContent = '✕';

    if (sunkShip) {
      sunkShip._cells.forEach(sc => {
        const el = getPlayerCell(sc.r, sc.c);
        if (el) el.className = 'cell sunk';
      });
      updateStatus(`The enemy sunk your ${sunkShip.name}! (${5 - computerShipsSunk} remaining)`);
    } else {
      updateStatus('Enemy hit your ship!');
    }
    checkWinCondition();
  } else {
    isComputerMiss(r, c, true);
    const cell = getPlayerCell(r, c);
    cell.className = 'cell miss';
    updateStatus('Enemy missed. Your turn!');
    playerTurn = true;
    setTimeout(() => {}, 400); // brief delay
  }
  updateShipsInfo();
}

function isComputerHit(r, c) {
  const el = getPlayerCell(r, c);
  return el && (el.classList.contains('hit') || el.classList.contains('sunk'));
}

function isComputerMiss(r, c) {
  const el = getPlayerCell(r, c);
  return el && el.classList.contains('miss');
}

function checkWinCondition() {
  if (playerShipsSunk >= 5) {
    phase = 'over';
    showOverlay('💥 Defeat!', 'The enemy sank all your ships.');
  } else if (computerShipsSunk >= 5) {
    phase = 'over';
    showOverlay('🏆 Victory!', 'You sank all enemy ships!');
  }
}

function updateStatus(text) {
  document.getElementById('status').textContent = text;
}

function updateShipsInfo() {
  const info = document.getElementById('ships-info');
  info.innerHTML = '';
  playerShips.forEach(ship => {
    const span = document.createElement('span');
    span.className = 'ship-status' + (ship.sunk ? ' sunk' : '');
    span.textContent = ship.name + (ship.sunk ? ' ✕' : ` (${ship.size})`);
    info.appendChild(span);
  });
}

function showOverlay(title, msg) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('overlay').classList.add('show');
}

// Event listeners
document.getElementById('btn-rotate').addEventListener('click', () => {
  horizontal = !horizontal;
  document.getElementById('btn-rotate').textContent = 'Rotate: ' + (horizontal ? '↕' : '↔');
});
document.getElementById('btn-random').addEventListener('click', randomizePlayerShips);
document.getElementById('btn-clear').addEventListener('click', clearPlayerShips);
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', init);

init();
</script>
</body>
</html>
