<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tic-Tac-Toe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    margin-bottom: 8px;
    background: linear-gradient(90deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .mode-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .mode-toggle button {
    padding: 8px 20px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    background: transparent;
    color: #ccc;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-toggle button.active {
    background: rgba(255,255,255,0.15);
    border-color: #ffd200;
    color: #ffd200;
  }

  .mode-toggle button:hover { background: rgba(255,255,255,0.08); }

  .scoreboard {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  .scoreboard div {
    padding: 6px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.07);
    min-width: 80px;
    text-align: center;
  }

  .scoreboard .x-score { color: #4fc3f7; }
  .scoreboard .o-score { color: #f48fb1; }
  .scoreboard .draw-score { color: #ccc; }

  .status {
    font-size: clamp(1rem, 3vw, 1.3rem);
    margin-bottom: 12px;
    height: 30px;
    line-height: 30px;
    text-align: center;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: clamp(260px, 70vmin, 360px);
    height: clamp(260px, 70vmin, 360px);
  }

  .cell {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2rem, 8vmin, 3.5rem);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .cell:hover:not(.taken) {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
  }

  .cell.taken { cursor: default; }

  .cell.x-mark { color: #4fc3f7; text-shadow: 0 0 12px rgba(79,195,247,0.5); }
  .cell.o-mark { color: #f48fb1; text-shadow: 0 0 12px rgba(244,143,177,0.5); }

  .cell.win-cell {
    animation: winPulse 0.6s ease-in-out infinite alternate;
    border-color: #ffd200;
    background: rgba(255,210,0,0.15);
  }

  @keyframes winPulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  .cell span {
    animation: popIn 0.25s ease-out forwards;
    display: inline-block;
  }

  .win-line {
    position: absolute;
    background: #ffd200;
    border-radius: 4px;
    z-index: 10;
    pointer-events: none;
  }

  .controls {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }

  .controls button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #1a1a2e;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .controls button:hover { transform: scale(1.05); }
  .controls button:active { transform: scale(0.97); }

  .difficulty-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .difficulty-toggle button {
    padding: 5px 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    background: transparent;
    color: #aaa;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .difficulty-toggle button.active {
    background: rgba(255,255,255,0.12);
    border-color: #4fc3f7;
    color: #4fc3f7;
  }

  .difficulty-toggle button:hover { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>

<h1>Tic-Tac-Toe</h1>

<div class="mode-toggle">
<button id="btn-ai" class="active" data-mode="ai">vs Computer</button>
<button id="btn-2p" data-mode="2p">2 Players</button>
</div>

<div class="difficulty-toggle" id="diff-toggle">
<button data-diff="easy">Easy</button>
<button data-diff="medium">Medium</button>
<button data-diff="hard" class="active">Unbeatable</button>
</div>

<div class="scoreboard">
  <div class="x-score">X: <span id="score-x">0</span></div>
  <div class="draw-score">Draw: <span id="score-d">0</span></div>
  <div class="o-score">O: <span id="score-o">0</span></div>
</div>

<div class="status" id="status">X goes first</div>

<div class="board" id="board">
  <div class="cell" data-idx="0"></div>
  <div class="cell" data-idx="1"></div>
  <div class="cell" data-idx="2"></div>
  <div class="cell" data-idx="3"></div>
  <div class="cell" data-idx="4"></div>
  <div class="cell" data-idx="5"></div>
  <div class="cell" data-idx="6"></div>
  <div class="cell" data-idx="7"></div>
  <div class="cell" data-idx="8"></div>
</div>

<div class="controls">
  <button id="btn-reset">New Game</button>
  <button id="btn-reset-scores">Reset Scores</button>
</div>

<script>
const WIN_COMBOS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let board = Array(9).fill('');
let currentPlayer = 'X';
let gameOver = false;
let mode = 'ai';
let difficulty = 'hard';
let scores = { X: 0, O: 0, D: 0 };

const cells = document.querySelectorAll('.cell');
const statusEl = document.getElementById('status');

// --- Event Listeners ---

// Board cell clicks (direct listeners on each cell for click support)
cells.forEach(function(cell) {
  cell.addEventListener('click', function(e) {
    const idx = parseInt(this.getAttribute('data-idx'), 10);
    handleClick(idx);
  });
});

// Mode toggle buttons
document.querySelectorAll('.mode-toggle button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    setMode(this.getAttribute('data-mode'));
  });
});

// Difficulty toggle buttons
document.querySelectorAll('.difficulty-toggle button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    setDiff(this.getAttribute('data-diff'));
  });
});

// Control buttons
document.getElementById('btn-reset').addEventListener('click', resetBoard);
document.getElementById('btn-reset-scores').addEventListener('click', resetAll);

// --- Game Logic ---

function setMode(m) {
  mode = m;
  document.getElementById('btn-ai').classList.toggle('active', m === 'ai');
  document.getElementById('btn-2p').classList.toggle('active', m === '2p');
  document.getElementById('diff-toggle').style.display = m === 'ai' ? 'flex' : 'none';
  resetAll();
}

function setDiff(d) {
  difficulty = d;
  document.querySelectorAll('.difficulty-toggle button').forEach(function(b) {
    b.classList.remove('active');
  });
  // Find button by data-diff attribute
  document.querySelectorAll('.difficulty-toggle button').forEach(function(b) {
    if (b.getAttribute('data-diff') === d) b.classList.add('active');
  });
  resetAll();
}

function handleClick(idx) {
  if (gameOver || board[idx]) return;
  if (mode === 'ai' && currentPlayer === 'O') return;

  makeMove(idx);

  if (mode === 'ai' && !gameOver) {
    setTimeout(aiMove, 250);
  }
}

function makeMove(idx) {
  board[idx] = currentPlayer;
  const cell = cells[idx];
  cell.innerHTML = '<span>' + currentPlayer + '</span>';
  cell.classList.add('taken', currentPlayer === 'X' ? 'x-mark' : 'o-mark');

  const win = checkWin(board, currentPlayer);
  if (win) {
    gameOver = true;
    highlightWin(win);
    scores[currentPlayer]++;
    updateScores();
    statusEl.textContent = currentPlayer + ' wins! \uD83C\uDF89';
    return;
  }

  if (board.every(function(c) { return c; })) {
    gameOver = true;
    scores.D++;
    updateScores();
    statusEl.textContent = "It's a draw! \uD83D\uDD1D";
    return;
  }

  currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
  statusEl.textContent = (mode === 'ai' && currentPlayer === 'O')
    ? 'Computer thinking...'
    : currentPlayer + "'s turn";
}

function checkWin(b, player) {
  for (let i = 0; i < WIN_COMBOS.length; i++) {
    const combo = WIN_COMBOS[i];
    if (combo[0] !== undefined && b[combo[0]] === player &&
        b[combo[1]] === player && b[combo[2]] === player) {
      return combo;
    }
  }
  return null;
}

function highlightWin(combo) {
  combo.forEach(function(i) { cells[i].classList.add('win-cell'); });
}

function updateScores() {
  document.getElementById('score-x').textContent = scores.X;
  document.getElementById('score-o').textContent = scores.O;
  document.getElementById('score-d').textContent = scores.D;
}

function resetBoard() {
  board = Array(9).fill('');
  currentPlayer = 'X';
  gameOver = false;
  cells.forEach(function(c) { c.innerHTML = ''; c.className = 'cell'; });
  statusEl.textContent = "X goes first";
}

function resetAll() {
  resetBoard();
  scores = { X: 0, O: 0, D: 0 };
  updateScores();
}

// --- AI ---
function aiMove() {
  if (gameOver) return;
  let move;
  if (difficulty === 'easy') move = aiEasy();
  else if (difficulty === 'medium') move = Math.random() < 0.65 ? aiBest() : aiEasy();
  else move = aiBest();

  makeMove(move);
}

function aiEasy() {
  const empty = [];
  for (let i = 0; i < 9; i++) {
    if (board[i] === '') empty.push(i);
  }
  return empty[Math.floor(Math.random() * empty.length)];
}

function aiBest() {
  let bestScore = -Infinity;
  let bestMove = -1;
  for (let i = 0; i < 9; i++) {
    if (board[i] !== '') continue;
    board[i] = 'O';
    const score = minimax(board, 0, false);
    board[i] = '';
    if (score > bestScore) {
      bestScore = score;
      bestMove = i;
    }
  }
  return bestMove;
}

function minimax(b, depth, isMax) {
  if (checkWin(b, 'O')) return 10 - depth;
  if (checkWin(b, 'X')) return depth - 10;
  if (b.every(function(c) { return c; })) return 0;

  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i] !== '') continue;
      b[i] = 'O';
      best = Math.max(best, minimax(b, depth + 1, false));
      b[i] = '';
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i] !== '') continue;
      b[i] = 'X';
      best = Math.min(best, minimax(b, depth + 1, true));
      b[i] = '';
    }
    return best;
  }
}
</script>

</body>
</html>
