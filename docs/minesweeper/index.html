<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #1a1a2e;
  color: #eee;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 10px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
h1 {
  font-size: 1.6rem;
  margin: 8px 0 6px;
  color: #e94560;
  letter-spacing: 2px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 8px 0;
  align-items: center;
}
.controls button, .controls select {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  font-size: 0.95rem;
  cursor: pointer;
  background: #16213e;
  color: #eee;
  transition: background 0.2s;
}
.controls button:hover, .controls select:hover {
  background: #e94560;
}
.controls button.active {
  background: #e94560;
}
.stats {
  display: flex;
  gap: 20px;
  margin: 6px 0;
  font-size: 1.1rem;
  font-weight: bold;
}
.stats span {
  background: #16213e;
  padding: 4px 12px;
  border-radius: 6px;
  min-width: 80px;
  text-align: center;
}
#board {
  display: grid;
  gap: 2px;
  margin: 8px 0;
  background: #0f3460;
  padding: 4px;
  border-radius: 8px;
  touch-action: none;
}
.cell {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  font-weight: bold;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s;
}
.cell.hidden {
  background: #1a1a4e;
  border: 1px solid #2a2a5e;
}
.cell.hidden:hover {
  background: #2a2a6e;
}
.cell.revealed {
  background: #16213e;
  border: 1px solid #0f3460;
}
.cell.mine {
  background: #e94560;
}
.cell.flagged {
  background: #1a1a4e;
  border: 1px solid #e94560;
}
.cell.mine-revealed {
  background: #c0392b;
}
.n1 { color: #3498db; }
.n2 { color: #2ecc71; }
.n3 { color: #e74c3c; }
.n4 { color: #9b59b6; }
.n5 { color: #e67e22; }
.n6 { color: #1abc9c; }
.n7 { color: #34495e; }
.n8 { color: #95a5a6; }
#message {
  font-size: 1.3rem;
  font-weight: bold;
  margin: 10px 0;
  min-height: 2em;
}
.win { color: #2ecc71; }
.lose { color: #e74c3c; }
#hint {
  font-size: 0.85rem;
  color: #888;
  margin-top: 4px;
}
</style>
</head>
<body>
<h1>💣 MINESWEEPER</h1>
<div class="controls">
  <button onclick="newGame(9,9,10)" id="btn-easy" class="active">Easy 9×9</button>
  <button onclick="newGame(16,16,40)" id="btn-medium">Medium 16×16</button>
  <button onclick="newGame(16,30,99)" id="btn-hard">Hard 16×30</button>
</div>
<div class="stats">
  <span>💣 <span id="mine-count">10</span></span>
  <span>⏱ <span id="timer">000</span></span>
  <span>🚩 <span id="flag-count">0</span></span>
</div>
<div id="board"></div>
<div id="message"></div>
<div id="hint">Left click: reveal · Right click: flag · Long press: flag (mobile)</div>
<script>
let cols, rows, mines, board, revealed, flagged, gameOver, firstClick, timerInterval, seconds;

function newGame(c, r, m) {
  cols = c; rows = r; mines = m;
  gameOver = false; firstClick = true;
  clearInterval(timerInterval); seconds = 0;
  document.getElementById('timer').textContent = '000';
  document.getElementById('message').textContent = '';
  document.getElementById('message').className = '';

  // Update active button
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  if (c === 9) document.getElementById('btn-easy').classList.add('active');
  else if (c === 16) document.getElementById('btn-medium').classList.add('active');
  else document.getElementById('btn-hard').classList.add('active');

  board = []; revealed = []; flagged = [];
  for (let y = 0; y < rows; y++) {
    board[y] = []; revealed[y] = []; flagged[y] = [];
    for (let x = 0; x < cols; x++) {
      board[y][x] = 0; revealed[y][x] = false; flagged[y][x] = false;
    }
  }

  document.getElementById('flag-count').textContent = '0';
  updateMineCount();
  renderBoard();
}

function placeMines(safeX, safeY) {
  let placed = 0;
  const safe = new Set();
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++)
      safe.add(`${safeX+dx},${safeY+dy}`);

  while (placed < mines) {
    const x = Math.floor(Math.random() * cols);
    const y = Math.floor(Math.random() * rows);
    if (board[y][x] === -1 || safe.has(`${x},${y}`)) continue;
    board[y][x] = -1;
    placed++;
  }
  // Calculate numbers
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      if (board[y][x] === -1) continue;
      let count = 0;
      forNeighbors(x, y, (nx, ny) => { if (board[ny][nx] === -1) count++; });
      board[y][x] = count;
    }
}

function forNeighbors(x, y, fn) {
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) fn(nx, ny);
    }
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const maxWidth = Math.min(window.innerWidth - 30, cols * 36);
  const cellSize = Math.max(24, Math.min(36, Math.floor(maxWidth / cols)));

  boardEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  boardEl.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell hidden';
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = (cellSize * 0.55) + 'px';
      cell.dataset.x = x;
      cell.dataset.y = y;
      boardEl.appendChild(cell);
    }
  }
  bindCells();
}

function bindCells() {
  const cells = document.querySelectorAll('.cell');
  let touchTimer = null;
  let touchStarted = false;

  cells.forEach(cell => {
    const x = parseInt(cell.dataset.x), y = parseInt(cell.dataset.y);

    // Touch: long press to flag
    cell.addEventListener('touchstart', (e) => {
      if (gameOver) return;
      touchStarted = true;
      touchTimer = setTimeout(() => {
        touchTimer = null;
        toggleFlag(x, y);
        touchStarted = false;
      }, 400);
    }, {passive: true});

    cell.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (touchTimer) {
        clearTimeout(touchTimer);
        touchTimer = null;
        if (touchStarted) { touchStarted = false; return; }
        revealCell(x, y);
      }
      touchStarted = false;
    }, {passive: false});

    cell.addEventListener('touchmove', () => {
      if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
      touchStarted = false;
    }, {passive: true});

    // Click
    cell.addEventListener('click', () => {
      if (gameOver) return;
      revealCell(x, y);
    });

    // Right click
    cell.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (gameOver) return;
      toggleFlag(x, y);
    });
  });
}

function getCell(x, y) {
  return document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
}

function revealCell(x, y) {
  if (gameOver || flagged[y][x] || revealed[y][x]) return;
  if (firstClick) {
    firstClick = false;
    placeMines(x, y);
    startTimer();
  }
  revealed[y][x] = true;
  const cell = getCell(x, y);
  cell.className = 'cell revealed';

  if (board[y][x] === -1) {
    cell.textContent = '💣';
    cell.classList.add('mine');
    endGame(false);
    return;
  }

  if (board[y][x] > 0) {
    cell.textContent = board[y][x];
    cell.classList.add('n' + board[y][x]);
  } else {
    // Flood fill
    forNeighbors(x, y, (nx, ny) => { if (!revealed[ny][nx]) revealCell(nx, ny); });
  }
  checkWin();
}

function toggleFlag(x, y) {
  if (gameOver || revealed[y][x]) return;
  flagged[y][x] = !flagged[y][x];
  const cell = getCell(x, y);
  if (flagged[y][x]) {
    cell.textContent = '🚩';
    cell.classList.remove('hidden');
    cell.classList.add('flagged');
  } else {
    cell.textContent = '';
    cell.classList.add('hidden');
    cell.classList.remove('flagged');
  }
  document.getElementById('flag-count').textContent = flagged.flat().filter(Boolean).length;
  updateMineCount();
}

function updateMineCount() {
  const flags = flagged.flat().filter(Boolean).length;
  document.getElementById('mine-count').textContent = mines - flags;
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = String(seconds).padStart(3, '0');
    if (seconds >= 999) clearInterval(timerInterval);
  }, 1000);
}

function checkWin() {
  let unrevealedSafe = 0;
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++)
      if (!revealed[y][x] && board[y][x] !== -1) unrevealedSafe++;
  if (unrevealedSafe === 0) endGame(true);
}

function endGame(won) {
  gameOver = true;
  clearInterval(timerInterval);
  const msg = document.getElementById('message');
  if (won) {
    msg.textContent = '🎉 YOU WIN!';
    msg.className = 'win';
    // Flag all mines
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++)
        if (board[y][x] === -1 && !flagged[y][x]) toggleFlag(x, y);
  } else {
    msg.textContent = '💥 GAME OVER';
    msg.className = 'lose';
    // Reveal all mines
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++)
        if (board[y][x] === -1) {
          const c = getCell(x, y);
          c.className = 'cell mine-revealed';
          c.textContent = '💣';
        }
  }
}

// Responsive: reflow on resize
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (!gameOver && firstClick) {
      clearInterval(timerInterval);
      seconds = 0;
      document.getElementById('timer').textContent = '000';
      renderBoard();
    }
  }, 250);
});

// Start
newGame(9, 9, 10);
</script>
</body>
</html>
