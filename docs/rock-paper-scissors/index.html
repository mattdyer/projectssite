<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --border: #2a2a4a;
    --text: #e0e0f0;
    --muted: #8888aa;
    --rock: #ff6b6b;
    --paper: #4ecdc4;
    --scissors: #ffe66d;
    --accent: #7c5cfc;
    --win: #2ecc71;
    --lose: #e74c3c;
    --draw: #f39c12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 20px;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 6px;
    background: linear-gradient(135deg, var(--rock), var(--paper), var(--scissors));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    gap: 16px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .score-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    text-align: center;
    min-width: 80px;
  }

  .score-box .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .score-box .value { font-size: 1.8rem; font-weight: bold; margin-top: 2px; }
  .score-box.wins .value { color: var(--win); }
  .score-box.losses .value { color: var(--lose); }
  .score-box.draws .value { color: var(--draw); }
  .score-box.streak .value { color: var(--accent); font-size: 1.4rem; }

  /* Arena */
  .arena {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-bottom: 30px;
    min-height: 140px;
    width: 100%;
    max-width: 500px;
  }

  .fighter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .fighter-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .choice-display {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    transition: all 0.3s ease;
    user-select: none;
    -webkit-user-select: none;
  }

  .choice-display.win { border-color: var(--win); box-shadow: 0 0 20px rgba(46, 204, 113, 0.3); }
  .choice-display.lose { border-color: var(--lose); box-shadow: 0 0 20px rgba(231, 76, 60, 0.3); }
  .choice-display.draw { border-color: var(--draw); box-shadow: 0 0 20px rgba(243, 156, 18, 0.3); }

  @keyframes shakePlayer {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-20deg) translateY(-10px); }
    50% { transform: rotate(10deg) translateY(-5px); }
    75% { transform: rotate(-10deg) translateY(-10px); }
  }

  @keyframes shakeCPU {
    0%, 100% { transform: scaleX(-1) rotate(0deg) translateY(0); }
    25% { transform: scaleX(-1) rotate(-20deg) translateY(-10px); }
    50% { transform: scaleX(-1) rotate(10deg) translateY(-5px); }
    75% { transform: scaleX(-1) rotate(-10deg) translateY(-10px); }
  }

  .shaking-player { animation: shakePlayer 0.15s ease-in-out 3; }
  .shaking-cpu { animation: shakeCPU 0.15s ease-in-out 3; }

  .vs {
    font-size: 1.4rem;
    font-weight: bold;
    color: var(--accent);
  }

  /* Result message */
  .result {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 24px;
    min-height: 36px;
    transition: opacity 0.3s;
  }

  .result.win { color: var(--win); }
  .result.lose { color: var(--lose); }
  .result.draw { color: var(--draw); }

  /* Combo banner */
  .combo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 3rem;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(124, 92, 252, 0.5);
    pointer-events: none;
    opacity: 0;
    z-index: 100;
  }

  .combo.show {
    animation: comboPop 1s ease-out forwards;
  }

  @keyframes comboPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
  }

  /* Choice buttons */
  .choices {
    display: flex;
    gap: 16px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .choice-btn {
    width: 110px;
    height: 110px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 3.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.2s ease;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .choice-btn .name { font-size: 0.85rem; color: var(--muted); }

  .choice-btn:hover { transform: scale(1.08); }
  .choice-btn:active { transform: scale(0.95); }
  .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .choice-btn.rock:hover { border-color: var(--rock); box-shadow: 0 0 20px rgba(255, 107, 107, 0.3); }
  .choice-btn.paper:hover { border-color: var(--paper); box-shadow: 0 0 20px rgba(78, 205, 196, 0.3); }
  .choice-btn.scissors:hover { border-color: var(--scissors); box-shadow: 0 0 20px rgba(255, 230, 109, 0.3); }

  /* History */
  .history {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 500px;
  }

  .history-title {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .history-rounds {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .history-round {
    background: var(--bg);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 60px;
    justify-content: center;
  }

  .history-round.w { border-left: 3px solid var(--win); }
  .history-round.l { border-left: 3px solid var(--lose); }
  .history-round.d { border-left: 3px solid var(--draw); }

  /* Reset button */
  .reset-btn {
    margin-top: 16px;
    padding: 10px 24px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Responsive */
  @media (max-width: 400px) {
    h1 { font-size: 1.4rem; }
    .choice-btn { width: 90px; height: 90px; font-size: 2.8rem; }
    .choice-display { width: 80px; height: 80px; font-size: 2.4rem; }
    .arena { gap: 20px; }
    .scoreboard { gap: 8px; }
    .score-box { padding: 8px 14px; min-width: 65px; }
  }
</style>
</head>
<body>

<h1>Rock Paper Scissors</h1>
<p class="subtitle">Best of streaks — watch your combo!</p>

<div class="scoreboard">
  <div class="score-box wins"><div class="label">Wins</div><div class="value" id="wins">0</div></div>
  <div class="score-box losses"><div class="label">Losses</div><div class="value" id="losses">0</div></div>
  <div class="score-box draws"><div class="label">Draws</div><div class="value" id="draws">0</div></div>
  <div class="score-box streak"><div class="label">Streak</div><div class="value" id="streak">0 🔥</div></div>
</div>

<div class="arena">
  <div class="fighter">
    <div class="fighter-label">You</div>
    <div class="choice-display" id="playerChoice">❓</div>
  </div>
  <div class="vs">VS</div>
  <div class="fighter">
    <div class="fighter-label">CPU</div>
    <div class="choice-display" id="cpuChoice">❓</div>
  </div>
</div>

<div class="result" id="result"></div>

<div class="choices" id="choices">
  <button class="choice-btn rock" data-choice="rock" aria-label="Rock">
    🪨<span class="name">Rock</span>
  </button>
  <button class="choice-btn paper" data-choice="paper" aria-label="Paper">
    📄<span class="name">Paper</span>
  </button>
  <button class="choice-btn scissors" data-choice="scissors" aria-label="Scissors">
    ✂️<span class="name">Scissors</span>
  </button>
</div>

<div class="history">
  <div class="history-title">Recent Rounds</div>
  <div class="history-rounds" id="historyRounds"></div>
</div>

<button class="reset-btn" id="resetBtn">Reset Score</button>

<div class="combo" id="combo"></div>

<script>
(function() {
  const choices = ['rock', 'paper', 'scissors'];
  const emojis = { rock: '🪨', paper: '📄', scissors: '✂️' };
  const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

  let wins = 0, losses = 0, draws = 0, streak = 0;
  let history = [];
  let busy = false;

  const winsEl = document.getElementById('wins');
  const lossesEl = document.getElementById('losses');
  const drawsEl = document.getElementById('draws');
  const streakEl = document.getElementById('streak');
  const playerEl = document.getElementById('playerChoice');
  const cpuEl = document.getElementById('cpuChoice');
  const resultEl = document.getElementById('result');
  const historyEl = document.getElementById('historyRounds');
  const comboEl = document.getElementById('combo');
  const btns = document.querySelectorAll('.choice-btn');
  const resetBtn = document.getElementById('resetBtn');

  // Load saved scores
  try {
    const saved = JSON.parse(localStorage.getItem('rps_scores'));
    if (saved) { wins = saved.w || 0; losses = saved.l || 0; draws = saved.d || 0; streak = saved.s || 0; }
  } catch(e) {}
  updateScoreboard();

  function updateScoreboard() {
    winsEl.textContent = wins;
    lossesEl.textContent = losses;
    drawsEl.textContent = draws;
    streakEl.textContent = streak + ' 🔥';
    try { localStorage.setItem('rps_scores', JSON.stringify({w:wins, l:losses, d:draws, s:streak})); } catch(e) {}
  }

  function playRound(playerChoice) {
    if (busy) return;
    busy = true;

    const cpuChoice = choices[Math.floor(Math.random() * 3)];
    btns.forEach(b => b.disabled = true);

    // Reset displays
    playerEl.className = 'choice-display';
    cpuEl.className = 'choice-display';
    resultEl.className = 'result';
    resultEl.textContent = '';

    // Shake animation
    playerEl.classList.add('shaking-player');
    cpuEl.classList.add('shaking-cpu');

    setTimeout(() => {
      playerEl.classList.remove('shaking-player');
      cpuEl.classList.remove('shaking-cpu');
      playerEl.textContent = emojis[playerChoice];
      cpuEl.textContent = emojis[cpuChoice];

      let outcome;
      if (playerChoice === cpuChoice) {
        outcome = 'draw';
        draws++;
        streak = 0;
        resultEl.textContent = "It's a draw!";
      } else if (beats[playerChoice] === cpuChoice) {
        outcome = 'win';
        wins++;
        streak++;
        resultEl.textContent = 'You win! 🎉';
        playerEl.classList.add('win');
        cpuEl.classList.add('lose');

        if (streak >= 3) showCombo(streak);
      } else {
        outcome = 'loss';
        losses++;
        streak = 0;
        resultEl.textContent = 'CPU wins!';
        playerEl.classList.add('lose');
        cpuEl.classList.add('win');
      }

      resultEl.classList.add(outcome);
      updateScoreboard();

      // Add to history
      history.unshift({ player: playerChoice, cpu: cpuChoice, outcome });
      if (history.length > 8) history.pop();
      renderHistory();

      btns.forEach(b => b.disabled = false);
      busy = false;
    }, 500);
  }

  function renderHistory() {
    historyEl.innerHTML = '';
    history.forEach(r => {
      const div = document.createElement('div');
      div.className = 'history-round ' + (r.outcome === 'win' ? 'w' : r.outcome === 'loss' ? 'l' : 'd');
      div.textContent = emojis[r.player] + ' vs ' + emojis[r.cpu];
      historyEl.appendChild(div);
    });
  }

  function showCombo(n) {
    comboEl.textContent = n + ' Streak!';
    comboEl.classList.remove('show');
    void comboEl.offsetWidth; // reflow
    comboEl.classList.add('show');
    setTimeout(() => comboEl.classList.remove('show'), 1100);
  }

  // Event listeners
  btns.forEach(btn => {
    btn.addEventListener('click', () => playRound(btn.dataset.choice));
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      playRound(btn.dataset.choice);
    });
  });

  resetBtn.addEventListener('click', () => {
    wins = losses = draws = streak = 0;
    history = [];
    playerEl.textContent = '❓';
    cpuEl.textContent = '❓';
    playerEl.className = 'choice-display';
    cpuEl.className = 'choice-display';
    resultEl.className = 'result';
    resultEl.textContent = '';
    updateScoreboard();
    renderHistory();
  });

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key === '1' || e.key.toLowerCase() === 'r') playRound('rock');
    else if (e.key === '2' || e.key.toLowerCase() === 'p') playRound('paper');
    else if (e.key === '3' || e.key.toLowerCase() === 's') playRound('scissors');
  });
})();
</script>

</body>
</html>
