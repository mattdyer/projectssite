<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 1rem;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
    color: #fff;
  }
  .subtitle {
    text-align: center;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 1rem;
  }

  /* Periodic Table Grid */
  .table-container {
    overflow-x: auto;
    padding-bottom: 0.5rem;
    -webkit-overflow-scrolling: touch;
  }
  .periodic-table {
    display: grid;
    grid-template-columns: repeat(18, minmax(52px, 1fr));
    grid-template-rows: repeat(10, minmax(52px, 1fr));
    gap: 3px;
    width: fit-content;
    margin: 0 auto;
  }

  /* Element Cell */
  .element {
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    padding: 2px;
    min-width: 52px;
    min-height: 52px;
  }
  .element:hover, .element:active {
    transform: scale(1.12);
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .element .number { font-size: 0.6rem; opacity: 0.8; }
  .element .symbol { font-size: 1.15rem; font-weight: 700; }
  .element .name { font-size: 0.45rem; opacity: 0.75; text-align: center; line-height: 1.1; }

  /* Category Colors */
  .cat-noble-gas     { background: #2d5a3d; color: #7fff9a; border: 1px solid #3a7a4d; }
  .cat-halogen       { background: #4a4a1a; color: #ffdd57; border: 1px solid #6a6a2a; }
  .cat-nonmetal      { background: #1a3a5a; color: #5ab5ff; border: 1px solid #2a5a7a; }
  .cat-metalloid     { background: #2a4a3a; color: #7dddaa; border: 1px solid #3a6a5a; }
  .cat-alkali-metal  { background: #5a1a1a; color: #ff7a7a; border: 1px solid #7a2a2a; }
  .cat-alkaline-earth{ background: #5a3a1a; color: #ffa87a; border: 1px solid #7a5a2a; }
  .cat-transition    { background: #3a2a4a; color: #c89aff; border: 1px solid #5a4a6a; }
  .cat-post-transition{ background: #2a3a5a; color: #88aaff; border: 1px solid #3a5a7a; }
  .cat-lanthanide    { background: #4a2a3a; color: #ff88bb; border: 1px solid #6a3a5a; }
  .cat-actinide      { background: #4a1a3a; color: #ff5599; border: 1px solid #6a2a5a; }
  .cat-unknown       { background: #2a2a2a; color: #888; border: 1px solid #444; }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin: 1rem auto;
    max-width: 700px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: #aaa;
  }
  .legend-swatch {
    width: 14px; height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* Detail Panel */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .detail-overlay.active { display: flex; }
  .detail-panel {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 1.5rem;
    max-width: 420px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    background: none;
    border: none;
    color: #888;
    font-size: 1.5rem;
    cursor: pointer;
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.2s;
  }
  .close-btn:hover { background: #333; color: #fff; }
  .detail-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .detail-symbol {
    width: 70px; height: 70px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .detail-symbol .num { font-size: 0.8rem; opacity: 0.8; }
  .detail-symbol .sym { font-size: 2rem; }
  .detail-name { font-size: 1.4rem; font-weight: 600; color: #fff; }
  .detail-category { font-size: 0.85rem; color: #aaa; margin-top: 2px; }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }
  .detail-item {
    background: #0f0f1a;
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
  }
  .detail-item .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
    margin-bottom: 2px;
  }
  .detail-item .value {
    font-size: 0.95rem;
    color: #ddd;
  }
  .detail-full { grid-column: 1 / -1; }

  /* Search / Filter */
  .controls {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }
  .controls input {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
    color: #e0e0e0;
    font-size: 0.9rem;
    width: 220px;
    outline: none;
  }
  .controls input:focus { border-color: #7ecfff; }
  .controls input::placeholder { color: #555; }

  /* Mobile */
  @media (max-width: 600px) {
    .periodic-table {
      grid-template-columns: repeat(18, minmax(42px, 1fr));
      grid-template-rows: repeat(10, minmax(42px, 1fr));
      gap: 2px;
    }
    .element { min-width: 42px; min-height: 42px; }
    .element .symbol { font-size: 0.9rem; }
    .element .number { font-size: 0.5rem; }
    .element .name { font-size: 0.38rem; }
    .detail-panel { padding: 1rem; }
    .detail-symbol { width: 55px; height: 55px; }
    .detail-symbol .sym { font-size: 1.6rem; }
  }

  .separator-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    color: #666;
    grid-column: 1 / -1;
    padding: 4px 0;
  }
  .lanthanide-label, .actinide-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    color: #666;
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    padding: 4px 0;
  }
</style>
</head>
<body>

</div>

const categories = {

  "metalloid":     { label: "Metalloid",          color: "#7dddaa", bg: "#2a4a3a" },

  "alkaline-earth":{ label: "Alkaline Earth",     color: "#ffa87a", bg: "#5a3a1a" },
  "transition":    { label: "Transition Metal",   color: "#c89aff", bg: "#3a2a4a" },

// Periodic table layout: [row, col, element_index]
// Rows: 1-7 main table, 9-10 for lanthanides/actinides
// Grid positions (1-indexed for CSS grid)

  [1,1,0],[1,18,1],

  [2,1,2],[2,2,3],[2,13,4],[2,14,5],[2,15,6],[2,16,7],[2,17,8],[2,18,9],

  [4,1,18],[4,2,19],[4,3,20],[4,4,21],[4,5,22],[4,6,23],[4,7,24],[4,8,25],[4,9,26],[4,10,27],[4,11,28],[4,12,29],[4,13,30],[4,14,31],[4,15,32],[4,16,33],[4,17,34],[4,18,35],

];

// Build a map from element index to [row, col]
const posMap = {};
positions.forEach(p => { posMap[p[2]] = { row: p[0], col: p[1] }; });

// Also fix actinide positions for Z=89-103 (indices 88-102)
// 89=Ac(idx 88), 90=Th(idx 89), 91=Pa(idx 90), 92=U(idx 91), 93=Np(idx 92), 94=Pu(idx 93), 95=Am(idx 94), 96=Cm(idx 95), 97=Bk(idx 96), 98=Cf(idx 97), 99=Es(idx 98), 100=Fm(idx 99), 101=Md(idx 100), 102=No(idx 101), 103=Lr(idx 102)
const actinideCols = {88:3,89:4,90:5,91:6,92:7,93:8,94:9,95:10,96:11,97:12,98:13,99:14,100:15,101:16,102:17};
for (const [idx, col] of Object.entries(actinideCols)) {
  posMap[parseInt(idx)] = { row: 10, col: col };
}

// Build the table
const table = document.getElementById('table');
const overlay = document.getElementById('overlay');
const detailContent = document.getElementById('detailContent');
const searchInput = document.getElementById('search');

// Build legend
const legendEl = document.getElementById('legend');
Object.entries(categories).forEach(([key, cat]) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-swatch" style="background:${cat.bg};border:1px solid ${cat.color}33"></span>${cat.label}`;
  legendEl.appendChild(item);
});

// Build element cells
elements.forEach((el, idx) => {
  const [z, sym, name, cat, mass, config, phase, en, density, melt, boil, discoverer, year, summary] = el;
  const pos = posMap[idx];
  if (!pos) return;

  const cell = document.createElement('div');
  cell.className = `element cat-${cat}`;
  cell.style.gridRow = pos.row;
  cell.style.gridColumn = pos.col;
  cell.dataset.index = idx;
  cell.innerHTML = `
    <span class="number">${z}</span>
    <span class="symbol">${sym}</span>
    <span class="name">${name}</span>
  `;
  cell.addEventListener('click', () => showDetail(idx));
  cell.addEventListener('touchend', (e) => { e.preventDefault(); showDetail(idx); });
  table.appendChild(cell);
});

// Separator labels
const sep1 = document.createElement('div');
sep1.className = 'separator-label';
sep1.style.gridRow = 8;
sep1.style.gridColumn = '1 / 4';
sep1.textContent = '57-71 ▼';
table.appendChild(sep1);

const sep2 = document.createElement('div');
sep2.className = 'separator-label';
sep2.style.gridRow = 8;
sep2.style.gridColumn = '1 / 4';
sep2.style.gridRowEnd = 'span 2';
sep2.style.marginTop = '48px';
sep2.textContent = '89-103 ▼';
table.appendChild(sep2);

// Show detail panel
function showDetail(idx) {
  const [z, sym, name, cat, mass, config, phase, en, density, melt, boil, discoverer, year, summary] = elements[idx];
  const catInfo = categories[cat] || categories.unknown;

  detailContent.innerHTML = `
    <div class="detail-header">
      <div class="detail-symbol cat-${cat}">
        <span class="num">${z}</span>
        <span class="sym">${sym}</span>
      </div>
      <div>
        <div class="detail-name">${name}</div>
        <div class="detail-category">${catInfo.label}</div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-item">
        <div class="label">Atomic Number</div>
        <div class="value">${z}</div>
      </div>
      <div class="detail-item">
        <div class="label">Atomic Mass</div>
        <div class="value">${mass} u</div>
      </div>
      <div class="detail-item">
        <div class="label">Phase (STP)</div>
        <div class="value">${phase.charAt(0).toUpperCase() + phase.slice(1)}</div>
      </div>
      <div class="detail-item">
        <div class="label">Electron Config</div>
        <div class="value" style="font-size:0.8rem">${config}</div>
      </div>
      ${en !== null ? `<div class="detail-item"><div class="label">Electronegativity (Pauling)</div><div class="value">${en}</div></div>` : ''}
      ${density !== null ? `<div class="detail-item"><div class="label">Density</div><div class="value">${density} g/cm³</div></div>` : ''}
      ${melt !== null ? `<div class="detail-item"><div class="label">Melting Point</div><div class="value">${melt} K (${(melt - 273.15).toFixed(1)}°C)</div></div>` : ''}
      ${boil !== null ? `<div class="detail-item"><div class="label">Boiling Point</div><div class="value">${boil} K (${(boil - 273.15).toFixed(1)}°C)</div></div>` : ''}
      <div class="detail-item detail-full">
        <div class="label">Discovered by</div>
        <div class="value">${discoverer} (${year})</div>
      </div>
      <div class="detail-item detail-full">
        <div class="label">About</div>
        <div class="value" style="font-size:0.85rem;line-height:1.5">${summary}</div>
      </div>
    </div>
  `;

  overlay.classList.add('active');
}

// Close panel
document.getElementById('closeBtn').addEventListener('click', () => overlay.classList.remove('active'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('active'); });

// Search / filter
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  document.querySelectorAll('.element').forEach(cell => {
    const idx = parseInt(cell.dataset.index);
    const el = elements[idx];
    const match = !q || el[2].toLowerCase().includes(q) || el[1].toLowerCase().includes(q) || el[0].toString() === q;
    cell.style.opacity = match ? '1' : '0.15';
    cell.style.pointerEvents = match ? 'auto' : 'none';
  });
});
</script>
</body>
</html>
